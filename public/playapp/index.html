/* ==== MOD: src/tokens.css ==== */
/* src/tokens.css - Design Tokens do PlayApp SPARK Alpha (Tema Escuro Canônico e Claro Classroom) */
:root {
  /* Paleta Base / Superfícies (Tema Escuro Canônico) */
  --bg: #0e0e11;
  --bg-external: #0b0b0d;
  --card: #151519;
  --card2: #1d1d23;
  --line: #26262f;
  --line2: #30303b;
  --line3: #3d3d4b;
  --line4: #56566a;

  /* Tipografia & Contraste */
  --text: #fafafa;
  --text2: #b8b8c6;
  --muted: #828294;

  /* Acentos de Marca (Fusão Menta - Q1) */
  --hero: #1A9E6B;
  --hero-dark: #12754e;
  --green: #3ecf8e;
  --greent: #3ecf8e;
  --gborder: rgba(62, 207, 142, 0.38);
  --gsoft: rgba(62, 207, 142, 0.1);

  /* Feedback & Alertas */
  --alert: #ff8f78;
  --alertb: rgba(229, 77, 46, 0.5);
  --alerts: rgba(229, 77, 46, 0.08);

  /* Gamificação / Ranks */
  --rank-faisca: #f59e0b;
  --rank-brasa: #f97316;
  --rank-chama: #ef4444;
  --rank-fogo: #8b5cf6;

  /* Formas, Raios e Sombras */
  --radius-card: 12px;
  --radius-pill: 9999px;
  --radius-photo: 14px;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--green);

  /* Fontes */
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', "Source Code Pro", Menlo, Consolas, monospace;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}

/* Modo Claro Classroom (com contraste AA ajustado conforme §11) */

/* ==== MOD: src/base.css ==== */
/* src/base.css - Reset, Layout Base, Tipografia e Acessibilidade (WCAG AA) */

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

main.site-main {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px calc(140px + env(safe-area-inset-bottom, 0px));
}

/* Tipografia Editorial */
h1, h2, h3, h4 {
  margin: 0 0 12px 0;
  color: var(--text);
  font-weight: 600;
}

h1 {
  font-size: clamp(28px, 5vw, 36px);
  line-height: 1.1;
  letter-spacing: -0.035em;
}

h2 {
  font-size: clamp(22px, 4vw, 26px);
  line-height: 1.15;
  letter-spacing: -0.03em;
}

h3 {
  font-size: 18px;
  line-height: 1.25;
  letter-spacing: -0.02em;
}

p {
  margin: 0 0 16px 0;
  color: var(--text2);
}

strong {
  color: var(--text);
  font-weight: 600;
}

a {
  color: var(--greent);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* Rótulos Mono e Elementos Decorativos */
.label {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.label.g {
  color: var(--greent);
  font-weight: 700;
}

.mono {
  font-family: var(--font-mono);
}

.bignum {
  font-family: var(--font-mono);
  font-size: 80px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.05em;
  color: transparent;
  -webkit-text-stroke: 1.5px var(--line3);
}

/* Acessibilidade & Foco WCAG 2.2 */
:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: 4px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Barra de Navegação Inferior Mobile-First */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background-color: var(--card);
  border-top: 1px solid var(--line2);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
}

.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted);
  min-width: 44px;
  min-height: 44px;
  justify-content: center;
  text-decoration: none;
}

.bottom-nav a.on, .bottom-nav a[aria-current="page"] {
  color: var(--greent);
  font-weight: 700;
}
/* ==== END: src/base.css ==== */

/* ==== MOD: src/components.css ==== */
/* src/components.css - Estilos Visuais dos Componentes A-K do PlayApp SPARK */

/* Botões */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  border-radius: var(--radius-card);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  min-height: 48px;
  min-width: 44px;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background-color: var(--green);
  color: #0b0b0d;
}

.btn-primary:hover {
  filter: brightness(1.08);
}

.btn-secondary {
  background-color: var(--card2);
  color: var(--text);
  border-color: var(--line2);
}

.btn-secondary:hover {
  background-color: var(--line);
}

.btn-alert {
  background-color: var(--alert);
  color: #ffffff;
}

.btn-ghost {
  background-color: transparent;
  color: var(--text2);
}

.btn-ghost:hover {
  color: var(--text);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 13px;
  min-height: 36px;
  border-radius: 8px;
}

.btn-outline-success {
  background: transparent;
  border-color: var(--green);
  color: var(--green);
}

.btn-outline-warning {
  background: transparent;
  border-color: var(--rank-brasa);
  color: var(--rank-brasa);
}

.btn-outline-alert {
  background: transparent;
  border-color: var(--alert);
  color: var(--alert);
}

/* Cards */
.card {
  background-color: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--radius-card);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card-highlight {
  border-color: var(--gborder);
  background-color: var(--card2);
}

.card-dashed {
  border: 1px dashed var(--line3);
  background-color: transparent;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.card-title {
  margin: 0;
  font-size: 18px;
}

/* Hero Banner (Suporta Imagens Nano Banana com Gradiente WCAG AA) */
.hero-banner {
  border-radius: var(--radius-photo);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  padding: 32px 20px 24px;
  margin-bottom: 24px;
  border: 1px solid var(--line2);
  position: relative;
  overflow: hidden;
}

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.hero-day-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
  background: rgba(0, 0, 0, 0.4);
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--gborder);
}

.hero-title {
  color: #ffffff;
  margin-bottom: 8px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

.hero-subtitle {
  color: #e5e5ea;
  font-size: 15px;
  margin: 0;
  line-height: 1.4;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* Chunks Cards & Leitner */
.chunk-card {
  background-color: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--radius-card);
  padding: 16px;
  margin-bottom: 12px;
}

.chunk-card.stage-3 {
  border-color: var(--gborder);
}

.chunk-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.chunk-phrase-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.chunk-phrase {
  font-size: 17px;
  color: var(--text);
}

.btn-audio {
  background: transparent;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 8px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
}

.chunk-translation {
  font-size: 14px;
  color: var(--text2);
  margin: 0 0 4px 0;
}

.chunk-example {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
  font-style: italic;
}

.chunk-review-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

/* Checklist Items */
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border-radius: 8px;
  background-color: var(--card2);
  margin-bottom: 8px;
  cursor: pointer;
  border: 1px solid transparent;
}

.checklist-item:hover {
  border-color: var(--line2);
}

.checklist-item.checked {
  background-color: var(--gsoft);
  border-color: var(--gborder);
}

.check-box {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  min-width: 24px;
  border: 2px solid var(--line3);
  border-radius: 6px;
  background-color: var(--bg);
  color: var(--green);
  font-weight: 700;
  font-size: 16px;
}

.checklist-item.checked .check-box {
  border-color: var(--green);
  background-color: var(--green);
  color: #0b0b0d;
}

.check-label {
  font-size: 15px;
  line-height: 1.4;
  color: var(--text);
}

.checklist-item.checked .check-label {
  color: var(--text2);
}

/* Escalas 1 a 5 */
.scale-group {
  margin-bottom: 16px;
  background: var(--card2);
  padding: 12px;
  border-radius: 8px;
}

.scale-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 14px;
}

.scale-buttons {
  display: flex;
  gap: 8px;
}

.scale-btn {
  flex: 1;
  height: 44px;
  border: 1px solid var(--line3);
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  font-family: var(--font-mono);
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
}

.scale-btn.on {
  background: var(--green);
  color: #0b0b0d;
  border-color: var(--green);
}

/* Timer Bar */
.timer-container {
  margin: 16px 0;
}

.timer-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

.timer-track {
  height: 10px;
  background-color: var(--line2);
  border-radius: 5px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  transition: width 0.1s linear, background-color 0.2s ease;
}

.timer-green { background-color: var(--green); }
.timer-yellow { background-color: var(--rank-faisca); }
.timer-red { background-color: var(--alert); }

/* Badges e Pílulas */
.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 600;
}

.badge-stage.stage-3 {

  color: var(--green);
}

.badge-stage.stage-2 {
  background-color: rgba(249, 115, 22, 0.1);
  color: var(--rank-brasa);
}

.badge-stage.stage-1 {
  background-color: var(--alerts);
  color: var(--alert);
}

.streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  background-color: var(--card2);
  border: 1px solid var(--line2);
}

.streak-pill.streak-active {
  border-color: var(--gborder);
}

.streak-pill.streak-atRisk {
  border-color: var(--rank-brasa);
}

.rank-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 8px;
  background-color: var(--card2);
  border: 1px solid var(--line2);
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 1000;
}

.modal-dialog {
  background-color: var(--card);
  border: 1px solid var(--line3);
  border-radius: var(--radius-card);
  max-width: 500px;
  width: 100%;
  padding: 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.btn-close {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  min-width: 44px;
  min-height: 44px;
}
/* ==== END: src/components.css ==== */

/* src/print.css - Folha de Estilos para Impressão A4 Limpa e Otimizada */

@media print {
  @page {
    margin: 1.5cm;
    size: A4 portrait;
  }

  *, *::before, *::after {
    background: transparent !important;
    color: #111111 !important;
    box-shadow: none !important;
    text-shadow: none !important;
  }

  body {
    background: #ffffff !important;
    color: #111111 !important;
    font-size: 11pt;
    line-height: 1.4;
    padding: 0 !important;
    margin: 0 !important;
  }

  /* Ocultar elementos interativos na impressão */
  header.hero-banner,
  .nav-bar,
  .btn,
  .btn-audio,
  .btn-copy,
  .header-actions,
  .print-controls,
  .screen-only {
    display: none !important;
  }

  /* Exibir elementos exclusivos de impressão */
  .print-only {
    display: block !important;
  }

  /* Estrutura de cartões e tabelas na impressão */
  .card, .print-card {
    border: 1px solid #cccccc !important;
    border-radius: 4px;
    padding: 12pt;
    margin-bottom: 12pt;
    page-break-inside: avoid;
  }

  h1, h2, h3, h4 {
    page-break-after: avoid;
    color: #000000 !important;
    font-weight: 700;
  }

  h1 { font-size: 18pt; margin-bottom: 6pt; }
  h2 { font-size: 14pt; margin-bottom: 4pt; }
  h3 { font-size: 12pt; margin-bottom: 4pt; }

  /* Tabela de Chunks para Impressão */
  .print-chunks-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10pt 0;
  }

  .print-chunks-table th,
  .print-chunks-table td {
    border: 1px solid #dddddd;
    padding: 6pt 8pt;
    text-align: left;
    font-size: 9pt;
  }

  .print-chunks-table th {
    background: #f4f4f4 !important;
    font-weight: bold;
  }

  .print-chunks-table .phrase-cell {
    font-family: monospace;
    font-weight: 700;
  }

  /* Gráfico de Radar */
  .radar-container svg {
    max-width: 240px;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  /* Rodapé do documento impresso */
  .print-footer {
    border-top: 1px solid #999999;
    padding-top: 6pt;
    margin-top: 15pt;
    font-size: 8pt;
    color: #666666 !important;
    text-align: center;
  }
}

// src/core/time.js - Funções puras de tempo, fuso horário e virada de ciclo diário (corte às 04:00)

/**
 * Converte data ISO ou milissegundos para objeto Date determinístico.
 * @param {string|number|Date} input
 * @returns {Date}
 */
function toDate(input) {
  if (input instanceof Date) return new Date(input.getTime());
  if (typeof input === 'number') return new Date(input);
  if (typeof input === 'string') return new Date(input);
  return new Date(0);
}

/**
 * Retorna a data no fuso de Brasília (UTC-3) como string YYYY-MM-DD considerando o horário de corte.
 * Por padrão, o corte do dia ocorre às 04:00 da manhã.
 * Qualquer atividade antes das 04:00 pertence ao dia letivo anterior.
 *
 * @param {string|number|Date} input - Data/hora da ação
 * @param {number} cutHour - Hora de virada do dia (default: 4)
 * @param {number} tzOffsetHours - Deslocamento de fuso em horas (default: -3 para Brasília)
 * @returns {string} Data letiva formato "YYYY-MM-DD"
 */
function studyDay(input, cutHour = 4, tzOffsetHours = -3) {
  const d = toDate(input);
  // Ajusta para o fuso horário alvo adicionando o offset em milissegundos
  const utcMs = d.getTime() + (d.getTimezoneOffset() * 60000);
  const targetMs = utcMs + (tzOffsetHours * 3600000);
  const localDate = new Date(targetMs);

  // Subtrai cutHour horas para deslocar a virada do dia
  localDate.setHours(localDate.getHours() - cutHour);

  const year = localDate.getFullYear();
  const month = String(localDate.getMonth() + 1).padStart(2, '0');
  const day = String(localDate.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}

/**
 * Calcula a diferença em dias inteiros entre duas datas no formato YYYY-MM-DD.
 * @param {string} dateStrA - "YYYY-MM-DD"
 * @param {string} dateStrB - "YYYY-MM-DD"
 * @returns {number} Diferença (B - A) em dias
 */
function diffDays(dateStrA, dateStrB) {
  if (!dateStrA || !dateStrB) return 0;
  const [y1, m1, d1] = dateStrA.split('-').map(Number);
  const [y2, m2, d2] = dateStrB.split('-').map(Number);

  const utc1 = Date.UTC(y1, m1 - 1, d1);
  const utc2 = Date.UTC(y2, m2 - 1, d2);

  const msPerDay = 86400000;
  return Math.floor((utc2 - utc1) / msPerDay);
}

/**
 * Formata minutos para exibição MM:SS
 * @param {number} totalSeconds
 * @returns {string} "MM:SS"
 */
function formatTimer(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const mins = Math.floor(s / 60);
  const secs = s % 60;
  return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

// src/core/streak.js - Gestão Pura de Ofensiva, Escudo de Proteção e Risco de Quebra

/**
 * Atualiza o estado da ofensiva quando uma atividade obrigatória é concluída no dia.
 * @param {object} streakState - { count, best, lastCompletedDate, shieldAvailable, history }
 * @param {string} currentDayStr - Data do dia letivo atual "YYYY-MM-DD"
 * @returns {object} Novo estado de ofensiva atualizado
 */
function recordStreak(streakState, currentDayStr) {
  const current = {
    count: streakState?.count || 0,
    best: streakState?.best || 0,
    lastCompletedDate: streakState?.lastCompletedDate || null,
    shieldAvailable: streakState?.shieldAvailable !== undefined ? Boolean(streakState.shieldAvailable) : true,
    history: Array.isArray(streakState?.history) ? [...streakState.history] : []
  };

  if (!current.lastCompletedDate) {
    // Primeiro dia concluído
    current.count = 1;
    current.best = 1;
    current.lastCompletedDate = currentDayStr;
    current.history.push(currentDayStr);
    return current;
  }

  const diff = diffDays(current.lastCompletedDate, currentDayStr);

  if (diff <= 0) {
    // Já concluiu no mesmo dia letivo
    return current;
  }

  if (diff === 1) {
    // Dia consecutivo: incrementa ofensiva
    current.count += 1;
    current.best = Math.max(current.best, current.count);
    current.lastCompletedDate = currentDayStr;
    current.history.push(currentDayStr);
    return current;
  }

  if (diff === 2 && current.shieldAvailable) {
    // Falhou um dia, mas possui escudo protetor ativo!
    current.shieldAvailable = false;
    current.count += 1;
    current.best = Math.max(current.best, current.count);
    current.lastCompletedDate = currentDayStr;
    current.history.push(currentDayStr);
    return current;
  }

  // Falha de 2+ dias sem escudo: ofensiva reinicia em 1
  current.count = 1;
  current.lastCompletedDate = currentDayStr;
  current.history.push(currentDayStr);
  return current;
}

/**
 * Avalia o status atual da ofensiva frente ao dia de estudo presente.
 * @param {object} streakState
 * @param {string} currentDayStr - "YYYY-MM-DD"
 * @returns {'active'|'atRisk'|'shielded'|'broken'|'none'}
 */
function streakStatus(streakState, currentDayStr) {
  if (!streakState?.lastCompletedDate) {
    return 'none';
  }

  const diff = diffDays(streakState.lastCompletedDate, currentDayStr);

  if (diff === 0) {
    return 'active'; // Concluído hoje
  }

  if (diff === 1) {
    return 'atRisk'; // Concluiu ontem, precisa praticar hoje para não perder
  }

  if (diff === 2 && streakState.shieldAvailable) {
    return 'shielded'; // Falhou ontem, mas o escudo está pronto para salvar
  }

  return 'broken'; // Quebrou
}

// src/core/diag.js - Nivelamento Cirúrgico: Cálculo de Pontuação, Faixas e Embaralhamento Determinístico
const TIMING = Object.freeze({
  WINDOW: 9000,
  FAST: 2500,
  SLOW: 7000
});
const QUALITY_SCORES = Object.freeze({
  chunk: 1.0,
  literal: 0.55,
  word: 0.20
});
const QUESTION_WEIGHTS = Object.freeze([0.35, 0.35, 0.30]);

/**
 * Função clamp pura
 */
function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

/**
 * Gerador pseudoaleatório Mulberry32 puro a partir de uma semente inteira.
 * Retorna uma função que produz números entre 0 e 1 de forma pura e determinística.
 */
function createPrng(seed = 12345) {
  let s = (seed >>> 0) || 1;
  return function next() {
    s |= 0;
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Embaralha um array de opções de forma estável usando uma semente.
 * @param {Array} arr - Array de entrada
 * @param {number} seed - Semente inteira
 * @returns {Array} Novo array embaralhado
 */
function shuffleOptions(arr, seed = 12345) {
  const prng = createPrng(seed);
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(prng() * (i + 1));
    const temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

/**
 * Calcula a pontuação de uma rodada individual (0 a 1).
 * @param {{ type?: 'chunk'|'literal'|'word', ms?: number, timeout?: boolean }} ans
 * @param {boolean} extendedTime - Se verdadeiro, dobra as janelas de tempo
 * @returns {number} Score da rodada (0.0 a 1.0)
 */
function scoreRound(ans, extendedTime = false) {
  if (!ans || ans.timeout) {
    // Timeout conta como word com velocidade 0
    return 0.7 * QUALITY_SCORES.word + 0.3 * 0;
  }

  const mult = extendedTime ? 2 : 1;
  const fast = TIMING.FAST * mult;
  const slow = TIMING.SLOW * mult;
  const windowLimit = TIMING.WINDOW * mult;

  const ms = typeof ans.ms === 'number' ? ans.ms : windowLimit;

  // Se excedeu a janela máxima, trata como timeout/word lenta
  if (ms > windowLimit) {
    return 0.7 * QUALITY_SCORES.word + 0.3 * 0;
  }

  const qType = ans.type && QUALITY_SCORES[ans.type] !== undefined ? ans.type : 'word';
  const qScore = QUALITY_SCORES[qType];

  const speed = clamp((slow - ms) / (slow - fast), 0, 1);

  return 0.7 * qScore + 0.3 * speed;
}

/**
 * Calcula o resultado completo do diagnóstico cirúrgico (3 perguntas).
 * E-01: Utiliza tolerância 1e-9 contra imprecisão de ponto flutuante, cravando 59 em 3 literais a 4s.
 * @param {Array<{ type?: string, ms?: number, timeout?: boolean }>} answers
 * @param {boolean} extendedTime
 * @returns {{ score: number, band: 'autônomo'|'descongelando'|'bloqueado', bottleneck: string }}
 */
function scoreDiag(answers = [], extendedTime = false) {
  let rawTotal = 0;

  for (let i = 0; i < 3; i++) {
    const ans = answers[i] || { timeout: true };
    const weight = QUESTION_WEIGHTS[i] || 0.30;
    const rScore = scoreRound(ans, extendedTime);
    rawTotal += rScore * weight;
  }

  // E-01: Adiciona 1e-9 para neutralizar 58.49999999999999 e garantir Math.round -> 59
  const score = Math.round(rawTotal * 100 + 1e-9);
  const band = bandOf(score);

  return {
    score,
    band,
    bottleneck: bottleneckOf(band)
  };
}

/**
 * Determina a faixa de reflexo oral a partir do score final.
 * @param {number} score
 * @returns {'autônomo'|'descongelando'|'bloqueado'}
 */
function bandOf(score) {
  if (score >= 75) return 'autônomo';
  if (score >= 45) return 'descongelando';
  return 'bloqueado';
}

/**
 * Retorna a descrição do gargalo neural/cognitivo para o laudo.
 * @param {'autônomo'|'descongelando'|'bloqueado'} band
 * @returns {string}
 */
function bottleneckOf(band) {
  if (band === 'autônomo') {
    return 'Autonomia consolidada com necessidade de repertório de nuances e imprevistos';
  }
  if (band === 'descongelando') {
    return 'Tradução mental intermitente e hesitação na troca de estruturas';
  }
  return 'Congelamento oral, dependência de tradução palavra por palavra e medo de errar';
}

/**

    },
    streak: {
      count: Math.max(0, Number(s.streak?.count ?? s.ofensiva?.atual ?? 0)),
      best: Math.max(0, Number(s.streak?.best ?? s.ofensiva?.melhor ?? 0)),
      lastCompletedDate: s.streak?.lastCompletedDate ?? s.ofensiva?.ultimoDia ?? base.streak.lastCompletedDate,
      shieldAvailable: s.streak?.shieldAvailable !== undefined ? Boolean(s.streak.shieldAvailable) : (s.ofensiva?.descansoUsadoEm ? false : true),
      history: Array.isArray(s.streak?.history) ? s.streak.history : []
    },
    xp: {

      log: Array.isArray(s.xp?.log) ? s.xp.log : []
    },

      ? s.achievements
      : (Array.isArray(s.selos) ? s.selos.map(item => (typeof item === 'string' ? item : item?.id)).filter(Boolean) : []),
    days: typeof s.days === 'object' && s.days !== null ? s.days : (typeof s.dias === 'object' && s.dias !== null ? s.dias : {}),
    chunks: typeof s.chunks === 'object' && s.chunks !== null ? s.chunks : {},
    arena: {

      score: typeof s.arena?.score === 'number' ? s.arena.score : null,
      history: Array.isArray(s.arena?.history) ? s.arena.history : []
    },
    outbox: Array.isArray(s.outbox) ? s.outbox : []
  };

  return out;
}

/**
 * Migra dados legados (v1, v2 ou desconhecido) para o Estado v3 canônico.
 * Nunca lança erro, preserva progresso do usuário e garante validade do schema.
 * @param {any} raw
 * @returns {object} Estado v3 garantido
 */
function migrate(raw) {
  if (!raw) {
    return clone(INITIAL_STATE);
  }

  let parsed = raw;
  if (typeof raw === 'string') {
    try {
      parsed = JSON.parse(raw);
    } catch {
      return clone(INITIAL_STATE);
    }
  }

  if (typeof parsed !== 'object' || parsed === null) {
    return clone(INITIAL_STATE);
  }

  // Se já for v3 e passar na validação estrita, apenas repara possíveis campos opcionais
  if (parsed.v === STATE_VERSION) {
    const check = validateState(parsed);
    if (check.valid) {
      return parsed;
    }
  }

  return repair(parsed);
}

/**
 * Calcula o XP derivado das cartas de Chunks praticadas.
 * Errata E-02: O valor atribuído por carta é estritamente o do estágio mais alto já alcançado (top),
 * e NÃO o somatório cumulativo dos estágios 1, 2 e 3.
 *
 * @param {Record<string, { top?: number }>} chunksState
 * @returns {number} XP total dos chunks (máx: 10 * 20 = 200 XP)
 */
function computeChunkXp(chunksState = {}) {
  let total = 0;
  for (const c of Object.values(chunksState)) {
    const top = c?.top || 0;
    total += STAGE_XP[top] || 0;
  }
  return total;
}

/**
 * Atribui XP ao estado garantindo idempotência estrita via chave única no log.
 * @param {object} xpState - { total: number, rank: string, log: Array<{ key, points, at }> }
 * @param {string} key - Chave única do evento (ex: "day_1_close", "ach_first_spark")
 * @param {number} points - Quantidade de pontos a somar
 * @param {string} [atIso] - Data ISO do evento
 * @returns {{ xpState: object, awarded: boolean }}
 */
function awardXp(xpState, key, points, atIso = null) {
  const currentTotal = xpState?.total || 0;
  const currentLog = Array.isArray(xpState?.log) ? [...xpState.log] : [];

  // Idempotência: Se a chave já existir no log, nunca pontua duas vezes
  if (currentLog.some(entry => entry.key === key)) {
    return {
      xpState: {
        total: currentTotal,
        rank: xpState?.rank || rankOf(currentTotal),
        log: currentLog
      },
      awarded: false
    };
  }

  const safePoints = Math.max(0, Number(points) || 0);
  const newTotal = currentTotal + safePoints;
  const newRank = rankOf(newTotal);

  currentLog.push({
    key,
    points: safePoints,
    at: atIso
  });

  return {
    xpState: {
      total: newTotal,
      rank: newRank,
      log: currentLog
    },
    awarded: true
  };
}

// src/core/rank.js - Classificação de Ranks e Limiares de XP
const RANK_THRESHOLDS = Object.freeze([
  { rank: 'fogo', minXp: 750 },

/**
 * Retorna o Rank correspondente ao total de XP acumulado.
 * @param {number} xpTotal
 * @returns {'faísca'|'brasa'|'chama'|'fogo'}
 */
function rankOf(xpTotal = 0) {
  const total = Math.max(0, Number(xpTotal) || 0);
  for (const t of RANK_THRESHOLDS) {
    if (total >= t.minXp) {
      return t.rank;
    }
  }
  return 'faísca';
}

/**
 * Retorna o progresso percentual até o próximo rank (0 a 100).
 * @param {number} xpTotal
 * @returns {{ currentRank: string, nextRank: string|null, currentXp: number, nextMinXp: number|null, percent: number }}
 */
function rankProgress(xpTotal = 0) {
  const current = rankOf(xpTotal);
  if (current === 'fogo') {
    return {
      currentRank: 'fogo',
      nextRank: null,
      currentXp: xpTotal,
      nextMinXp: null,
      percent: 100
    };
  }

  if (current === 'chama') {
    const range = 750 - 450;
    const progress = Math.max(0, xpTotal - 450);
    return {
      currentRank: 'chama',
      nextRank: 'fogo',
      currentXp: xpTotal,
      nextMinXp: 750,
      percent: Math.min(100, Math.floor((progress / range) * 100))
    };
  }

  if (current === 'brasa') {
    const range = 450 - 150;
    const progress = Math.max(0, xpTotal - 150);
    return {
      currentRank: 'brasa',
      nextRank: 'chama',
      currentXp: xpTotal,
      nextMinXp: 450,
      percent: Math.min(100, Math.floor((progress / range) * 100))
    };
  }

  // faísca
  const range = 150;
  return {
    currentRank: 'faísca',
    nextRank: 'brasa',
    currentXp: xpTotal,
    nextMinXp: 150,
    percent: Math.min(100, Math.floor((xpTotal / range) * 100))
  };
}

/**
 * Avalia o estado e retorna conquistas recém-desbloqueadas.
 * Função pura e idempotente: nunca adiciona duplicatas à lista existente.
 *
 * @param {object} state - Estado v3 do aluno
 * @returns {{ newlyUnlocked: Array<object>, allUnlockedIds: string[] }}
 */
function evaluateAchievements(state) {
  const currentUnlocked = new Set(Array.isArray(state?.achievements) ? state.achievements : []);
  const newlyUnlocked = [];

  for (const ach of ACHIEVEMENTS) {
    if (currentUnlocked.has(ach.id)) {
      continue;
    }

    let earned = false;

    if (ach.id === 'first_spark' && state?.test?.completed) {
      earned = true;
    } else if (ach.id === 'day1' && state?.days?.['1']?.status === 'fechado') {
      earned = true;
    } else if (ach.id === 'streak3' && (state?.streak?.count || 0) >= 3) {
      earned = true;
    } else if (ach.id === 'streak7' && (state?.streak?.count || 0) >= 7) {
      earned = true;
    } else if (ach.id === 'blind' && (state?.days?.['5']?.status === 'fechado' || state?.days?.['6']?.status === 'fechado')) {
      earned = true;
    } else if (ach.id === 'boss' && (state?.days?.['7']?.status === 'fechado' || state?.arena?.completed)) {
      earned = true;
    }

    if (earned) {
      newlyUnlocked.push(ach);
      currentUnlocked.add(ach.id);
    }
  }

  return {
    newlyUnlocked,
    allUnlockedIds: Array.from(currentUnlocked)
  };
}

const LEITNER_INTERVALS = Object.freeze({
  1: 1, // Caixa 1: 1 dia
  2: 3, // Caixa 2: 3 dias
  3: 7  // Caixa 3: 7 dias
});

/**
 * Adiciona dias a uma data no formato "YYYY-MM-DD" e retorna a nova data string.
 * @param {string} dateStr - "YYYY-MM-DD"
 * @param {number} days - Quantidade de dias a somar
 * @returns {string} "YYYY-MM-DD"
 */
function addDays(dateStr, days) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(Date.UTC(y, m - 1, d + days));
  const rY = date.getUTCFullYear();
  const rM = String(date.getUTCMonth() + 1).padStart(2, '0');
  const rD = String(date.getUTCDate()).padStart(2, '0');
  return `${rY}-${rM}-${rD}`;
}

/**
 * Registra a revisão ou prática de um Chunk segundo o algoritmo Leitner.
 * Invariante (E-02): O campo `top` (estágio máximo alcançado) NUNCA regride.
 *
 * @param {object} chunkState - { stage, top, nextReviewDate, history }
 * @param {'natural'|'esforco'|'travou'} rating
 * @param {string} currentDayStr - "YYYY-MM-DD"
 * @returns {object} Novo estado atualizado do chunk
 */
function reviewChunk(chunkState, rating, currentDayStr) {
  const prevStage = chunkState?.stage || 0;
  const prevTop = chunkState?.top || 0;
  const history = Array.isArray(chunkState?.history) ? [...chunkState.history] : [];

  let newStage = 1;
  let interval = 1;

  if (rating === 'natural') {
    newStage = Math.min(3, prevStage + 1);
    interval = LEITNER_INTERVALS[newStage] || 7;
  } else if (rating === 'esforco') {
    newStage = Math.max(1, prevStage === 0 ? 1 : prevStage);
    interval = 2;
  } else {
    // 'travou'
    newStage = 1;
    interval = LEITNER_INTERVALS[1];
  }

  // O estágio mais alto (top) nunca regride
  const newTop = Math.max(prevTop, newStage);
  const nextReviewDate = addDays(currentDayStr, interval);

  history.push({
    at: currentDayStr,
    rating,
    stage: newStage
  });

  return {
    stage: newStage,
    top: newTop,
    lastReviewedAt: currentDayStr,
    nextReviewDate,
    history
  };
}

/**
 * Retorna os chunks que estão prontos para revisão na data atual.
 * @param {Record<string, object>} chunksMap - Mapa de id -> chunkState
 * @param {string} currentDayStr - "YYYY-MM-DD"
 * @returns {string[]} Lista de IDs de chunks vencidos para revisão
 */
function dueChunks(chunksMap = {}, currentDayStr) {
  const due = [];
  for (const [id, c] of Object.entries(chunksMap)) {
    if (!c.nextReviewDate) {
      due.push(id);
    } else {
      const diff = diffDays(c.nextReviewDate, currentDayStr);
      // Se diff >= 0, a data de revisão já chegou ou passou
      if (diff >= 0) {
        due.push(id);
      }
    }
  }
  return due;
}

/**
 * Normaliza um número de telefone brasileiro para o formato internacional com código 55.
 * Aceita números com ou sem +55, com 10 ou 11 dígitos (DDD + 8 ou 9 dígitos).
 *
 * @param {string} phoneRaw
 * @returns {string|null} Número no formato "55DD9XXXXXXXX" ou null se inválido
 */
function normalizeBR(phoneRaw) {
  if (!phoneRaw || typeof phoneRaw !== 'string') return null;

  let digits = phoneRaw.replace(/\D/g, '');

  // Se já tiver 55 no início e totalizar 12 ou 13 dígitos
  if (digits.startsWith('55') && (digits.length === 12 || digits.length === 13)) {
    digits = digits.slice(2);
  }

  // Número brasileiro válido possui 10 (fixo) ou 11 dígitos (celular com 9)
  if (digits.length !== 10 && digits.length !== 11) {
    return null;
  }

  const ddd = parseInt(digits.slice(0, 2), 10);
  if (ddd < 11 || ddd > 99) {
    return null;
  }

  return `55${digits}`;
}

/**
 * Monta o texto legível do dossiê do aluno para envio via WhatsApp para o Professor Gabe.
 * Função 100% ética e pura: nenhum dado falso ou pontuação inventada.
 *
 * @param {object} state - Estado v3 do aluno
 * @param {object} [extra] - Dados complementares (ex: motivo de interesse)
 * @returns {string} Mensagem formatada
 */
function formatDossier(state, extra = {}) {
  const profileName = state?.profile?.name || extra.name || '[Nome não informado]';
  const xp = state?.xp?.total || 0;
  const rank = (state?.xp?.rank || 'faísca').toUpperCase();

  // Diagnóstico
  let diagText = 'Não realizado';
  if (state?.test?.completed && typeof state?.test?.score === 'number') {
    const bandName = state.test.band ? state.test.band.toUpperCase() : 'N/A';
    diagText = `${state.test.score}/100 (Faixa: ${bandName})`;
  }

  // Progresso de Dias
  const daysMap = state?.days || {};
  const closedDays = Object.values(daysMap).filter(d => d.status === 'fechado').length;

  // Chunks Dominados (estágio top 3)
  const chunksMap = state?.chunks || {};
  const masteredChunks = Object.values(chunksMap).filter(c => c.top === 3).length;
  const totalChunksPracticed = Object.keys(chunksMap).length;

  const lines = [
    `*DOSSIÊ DE ENTRADA · SPARK ALPHA*`,
    `--------------------------------`,
    `*Aluno:* ${profileName}`,
    `*Diagnóstico Oral:* ${diagText}`,
    `*Dias Concluídos:* ${closedDays} de 7`,
    `*Chunks Dominados:* ${masteredChunks} de 10 (Praticados: ${totalChunksPracticed})`,
    `*Ofensiva Atual:* ${state?.streak?.count || 0} dias`,
    `*XP Total:* ${xp} pts (Rank: ${rank})`,
    `--------------------------------`,
    `*Objetivo:* Aplicação para uma das 10 vagas fundadoras da Turma Alpha do Gabe.`
  ];

  if (extra.interest) {
    lines.push(`*Motivo informado:* ${extra.interest}`);
  }

  return lines.join('\n');
}

/**
 * Constrói e valida o payload oficial de Lead para envio ao moodle-bridge.
 *
 * @param {object} state - Estado atual v3
 * @param {object} form - Dados preenchidos no formulário
 * @returns {{ valid: boolean, payload?: object, errors?: string[] }}
 */
function buildLeadPayload(state, form = {}) {
  const normalizedPhone = normalizeBR(form.whatsapp);
  const payload = {
    name: (form.name || '').trim(),
    whatsapp: normalizedPhone || '',
    email: form.email ? form.email.trim() : null,
    lgpdConsent: form.lgpdConsent === true,
    diagnosticScore: state?.test?.score ?? null,
    diagnosticBand: state?.test?.band ?? null,
    xpTotal: state?.xp?.total ?? 0,
    rank: state?.xp?.rank ?? 'faísca',
    daysCompleted: Object.values(state?.days || {}).filter(d => d.status === 'fechado').length,
    submittedAt: form.submittedAt || null
  };

  const validation = validateLeadPayload(payload);
  if (!validation.valid) {
    return {
      valid: false,
      errors: validation.errors
    };
  }

  return {
    valid: true,
    payload
  };
}

/**
 * Transição de estado da fila de envio offline (Outbox).
 * Estados possíveis: 'queued' | 'sending' | 'sent' | 'failed'
 *
 * @param {object} item - Item na fila do outbox
 * @param {'START_SEND'|'SEND_SUCCESS'|'SEND_FAIL'} action
 * @param {object} [eventData]
 * @returns {object} Novo estado do item
 */
function transitionOutboxItem(item, action, eventData = {}) {
  const current = { ...item };

  if (action === 'START_SEND') {
    return {
      ...current,
      status: 'sending',
      lastAttemptAt: eventData.nowIso || null
    };
  }

  if (action === 'SEND_SUCCESS') {
    return {
      ...current,
      status: 'sent',
      sentAt: eventData.nowIso || null,
      responseId: eventData.responseId || null
    };
  }

  if (action === 'SEND_FAIL') {
    const attempts = (current.attempts || 0) + 1;
    return {
      ...current,
      status: 'failed',
      attempts,
      lastError: eventData.error || 'Erro de conexão',
      lastAttemptAt: eventData.nowIso || null
    };
  }

  return current;
}

/**
 * Redutor puro de estado e despachante de efeitos.
 *
 * @param {object} state - Estado atual v3 (imutável)
 * @param {{ type: string, payload?: any }} msg - Ação disparada
 * @param {{ nowMs: number, nowIso: string, studyDay: string }} env - Dependências determinísticas
 * @returns {{ state: object, fx: Array<{ type: string, payload?: any }> }}
 */
function update(state = INITIAL_STATE, msg = {}, env = {}) {
  const current = state || INITIAL_STATE;
  const type = msg?.type;
  const p = msg?.payload || {};

  const nowIso = env.nowIso || '2026-11-04T12:00:00.000Z';
  const today = env.studyDay || '2026-11-04';

  const fx = [];

  switch (type) {
    case 'START_DIAGNOSTIC': {
      const nextState = {
        ...current,
        test: {
          started: true,
          completed: false,
          score: null,
          band: null,
          answers: []
        }
      };
      return { state: nextState, fx };
    }

    case 'SUBMIT_ANSWER': {
      const answers = [...(current.test?.answers || []), p];
      const completed = answers.length >= 3;

      let score = current.test?.score ?? null;
      let band = current.test?.band ?? null;
      let nextXp = { ...(current.xp || { total: 0, rank: 'faísca', log: [] }) };

      if (completed) {
        const diagResult = scoreDiag(answers, Boolean(p.extendedTime));
        score = diagResult.score;
        band = diagResult.band;

        // Atribui XP pelo diagnóstico concluído
        const xpRes = awardXp(nextXp, 'diag_complete', XP_TABLE.DIAGNOSTIC_COMPLETED, nowIso);
        nextXp = xpRes.xpState;

        fx.push({
          type: 'TRIGGER_CELEBRATION',
          payload: { reason: 'diagnostic_completed', score, band }
        });
      }

      const tempState = {
        ...current,
        test: {
          completed,
          score,
          band,
          answers
        },
        xp: nextXp
      };

      // Avalia conquistas (ex: first_spark)
      const achEval = evaluateAchievements(tempState);
      let finalXp = nextXp;
      for (const ach of achEval.newlyUnlocked) {
        finalXp = awardXp(finalXp, `ach_${ach.id}`, ach.points, nowIso).xpState;
      }

      const nextState = {
        ...tempState,
        xp: finalXp,
        achievements: achEval.allUnlockedIds
      };

      return { state: nextState, fx };
    }

    case 'COMPLETE_SETUP_ITEM': {
      const itemKey = p.key; // toolChosen, pinnedChat, scheduleSet, policyChecked
      const currentVal = Boolean(current.setup?.[itemKey]);
      const nextVal = p.value !== undefined ? Boolean(p.value) : !currentVal;
      const setup = {
        ...(current.setup || {}),
        [itemKey]: nextVal
      };
      return {
        state: { ...current, setup },
        fx
      };
    }

    case 'FINISH_SETUP': {
      const setup = {
        ...(current.setup || {}),
        completed: true,
        completedAt: nowIso
      };
      const xpRes = awardXp(current.xp, 'setup_complete', XP_TABLE.SETUP_COMPLETED, nowIso);
      return {
        state: {
          ...current,
          setup,
          xp: xpRes.xpState
        },
        fx
      };
    }

    case 'OPEN_DAY': {
      const dayNum = String(p.num);
      const days = { ...(current.days || {}) };
      days[dayNum] = {
        ...(days[dayNum] || {}),
        status: 'aberto',
        abertoEm: nowIso
      };
      return {
        state: { ...current, days },
        fx
      };
    }

    case 'TOGGLE_MISSION_ITEM': {
      const dayNum = String(p.num);
      const idx = Number(p.index);
      const days = { ...(current.days || {}) };
      const dayData = { ...(days[dayNum] || {}) };
      const missions = Array.isArray(dayData.missions) ? [...dayData.missions] : [];

      missions[idx] = !missions[idx];
      dayData.missions = missions;
      days[dayNum] = dayData;

      return {
        state: { ...current, days },
        fx
      };
    }

    case 'SET_DAY_NOTE': {
      const dayNum = String(p.num);
      const days = { ...(current.days || {}) };
      const dayData = { ...(days[dayNum] || {}) };
      const notes = { ...(dayData.notes || {}), [p.key]: p.value };

      dayData.notes = notes;
      days[dayNum] = dayData;

      return {
        state: { ...current, days },
        fx
      };
    }

    case 'CLOSE_DAY': {
      const dayNum = String(p.num);
      const days = { ...(current.days || {}) };
      const dayData = { ...(days[dayNum] || {}) };

      dayData.status = 'fechado';
      dayData.completed = true;
      dayData.completedAt = nowIso;
      dayData.fechadoEm = nowIso;
      days[dayNum] = dayData;

      // Atualiza ofensiva
      const nextStreak = recordStreak(current.streak, today);

      // Atribui XP do fechamento
      let nextXp = awardXp(current.xp, `day_${dayNum}_close`, XP_TABLE.DAY_CLOSED, nowIso).xpState;

      const tempState = {
        ...current,
        days,
        streak: nextStreak,
        xp: nextXp
      };

      // Avalia conquistas (day1, streak3, streak7, blind, boss)
      const achEval = evaluateAchievements(tempState);
      for (const ach of achEval.newlyUnlocked) {
        nextXp = awardXp(nextXp, `ach_${ach.id}`, ach.points, nowIso).xpState;
      }

      fx.push({
        type: 'TRIGGER_CELEBRATION',
        payload: { reason: 'day_closed', day: dayNum }
      });

      return {
        state: {
          ...tempState,
          xp: nextXp,
          achievements: achEval.allUnlockedIds
        },
        fx
      };
    }

    case 'COPY_PROMPT': {
      const dayNum = String(p.num || 'global');
      const xpRes = awardXp(current.xp, `copy_prompt_d${dayNum}`, XP_TABLE.PROMPT_COPIED, nowIso);
      return {
        state: {
          ...current,
          xp: xpRes.xpState
        },
        fx
      };
    }

    case 'LEVEL_UP_CHUNK':
    case 'REVIEW_CHUNK': {
      const chunkId = p.id;
      const rating = p.rating || 'natural';
      const chunks = { ...(current.chunks || {}) };
      const chunkData = chunks[chunkId] || {};

      const nextChunk = reviewChunk(chunkData, rating, today);
      chunks[chunkId] = nextChunk;

      // Recalcula XP total de chunks
      const chunkXpTotal = computeChunkXp(chunks);
      // Registra/atualiza o XP de chunks via chave dedicada
      let nextXp = awardXp(current.xp, 'chunks_mastery', chunkXpTotal, nowIso).xpState;
      nextXp = {
        ...nextXp,
        rank: rankOf(nextXp.total)
      };

      return {
        state: {
          ...current,
          chunks,
          xp: nextXp
        },
        fx
      };
    }

    case 'RECORD_ARENA_ROUND': {
      const arena = { ...(current.arena || {}) };
      const history = [...(arena.history || []), { ...p, at: nowIso }];
      arena.history = history;

      return {
        state: { ...current, arena },
        fx
      };
    }

    case 'FINISH_ARENA': {
      const arena = {
        ...(current.arena || {}),
        completed: true,
        completedAt: nowIso,
        score: p.score || 100
      };

      let nextXp = awardXp(current.xp, 'arena_boss_victory', XP_TABLE.BOSS_RAID_COMPLETED, nowIso).xpState;

      const tempState = {
        ...current,
        arena,
        xp: nextXp
      };

      const achEval = evaluateAchievements(tempState);
      for (const ach of achEval.newlyUnlocked) {
        nextXp = awardXp(nextXp, `ach_${ach.id}`, ach.points, nowIso).xpState;
      }

      fx.push({
        type: 'TRIGGER_CELEBRATION',
        payload: { reason: 'arena_victory', score: arena.score }
      });

      return {
        state: {
          ...tempState,
          arena,
          xp: nextXp,
          achievements: achEval.allUnlockedIds
        },
        fx
      };
    }

    case 'SUBMIT_LEAD': {
      const form = p.form || {};
      const leadRes = buildLeadPayload(current, form);

      if (!leadRes.valid) {
        return {
          state: current,
          fx: [{ type: 'ANNOUNCE_SR', payload: { message: leadRes.errors.join('. ') } }]
        };
      }

      const outboxItem = {
        id: `lead_${nowIso}`,
        payload: leadRes.payload,
        status: 'queued',
        createdAt: nowIso,
        attempts: 0
      };

      const nextOutbox = [...(current.outbox || []), outboxItem];

      fx.push({
        type: 'DISPATCH_OUTBOX',
        payload: outboxItem
      });

      return {
        state: {
          ...current,
          profile: {
            ...(current.profile || {}),
            name: leadRes.payload.name,
            whatsapp: leadRes.payload.whatsapp,
            email: leadRes.payload.email
          },
          outbox: nextOutbox
        },
        fx
      };
    }

    case 'RESET_STATE': {
      return {
        state: JSON.parse(JSON.stringify(INITIAL_STATE)),
        fx: [{ type: 'TRIGGER_CELEBRATION', payload: { reason: 'reset' } }]
      };
    }

    default:
      return { state: current, fx };
  }
}

/**
 * Interpola variáveis no texto do prompt (ex: [NIVEL] e [CENARIO]).
 * @param {string} template
 * @param {Record<string, string>} vars
 * @returns {string} Prompt preenchido
 */
function renderPrompt(template, vars = {}) {
  let text = template;
  for (const [key, val] of Object.entries(vars)) {
    text = text.replaceAll(`[${key.toUpperCase()}]`, val || '');
  }
  return text;
}

// src/store/store.js - Persistência LocalStorage, Migração e Resiliência
const STORAGE_KEY = 'SPARK_ALPHA_V3';

/**
 * Carrega e migra o estado persistido do localStorage.
 * Retorna INITIAL_STATE se não houver dados ou se houver corrupção.
 * @param {Storage} [storage=typeof window !== 'undefined' ? window.localStorage : null]
 * @returns {object} Estado validado e migrado
 */
function loadState(storage = (typeof window !== 'undefined' ? window.localStorage : null)) {
  if (!storage) return { ...INITIAL_STATE };

  try {
    const raw = storage.getItem(STORAGE_KEY);
    if (!raw) return { ...INITIAL_STATE };
    const parsed = JSON.parse(raw);
    return migrate(parsed);
  } catch (err) {
    console.warn('[PlayApp] Falha ao carregar estado do localStorage, restaurando padrão:', err);
    return { ...INITIAL_STATE };
  }
}

/**
 * Persiste o estado no localStorage de forma resiliente contra estouro de cota.
 * @param {object} state
 * @param {Storage} [storage=typeof window !== 'undefined' ? window.localStorage : null]
 * @returns {boolean} Sucesso da gravação
 */
function saveState(state, storage = (typeof window !== 'undefined' ? window.localStorage : null)) {
  if (!storage || !state) return false;

  try {
    const serialized = JSON.stringify(state);
    storage.setItem(STORAGE_KEY, serialized);
    return true;
  } catch (err) {
    console.error('[PlayApp] Erro ao persistir estado no localStorage:', err);
    return false;
  }
}

/**
 * Limpa o armazenamento e retorna o estado canônico inicial.
 * @param {Storage} [storage=typeof window !== 'undefined' ? window.localStorage : null]
 * @returns {object} INITIAL_STATE
 */
function resetStoredState(storage = (typeof window !== 'undefined' ? window.localStorage : null)) {
  if (storage) {
    try {
      storage.removeItem(STORAGE_KEY);
    } catch (err) {
      console.warn('[PlayApp] Erro ao remover chave do storage:', err);
    }
  }
  return { ...INITIAL_STATE };
}

/**
 * Exporta o estado atual como uma string JSON formatada.
 * @param {object} state
 * @returns {string}
 */
function exportStateJson(state) {
  return JSON.stringify(state || INITIAL_STATE, null, 2);
}

/**
 * Importa e migra dados a partir de uma string JSON.
 * @param {string} jsonStr
 * @returns {{ success: boolean, state?: object, error?: string }}
 */
function importStateJson(jsonStr) {
  if (!jsonStr || typeof jsonStr !== 'string') {
    return { success: false, error: 'Conteúdo JSON inválido' };
  }

  try {
    const parsed = JSON.parse(jsonStr);
    const migrated = migrate(parsed);
    return { success: true, state: migrated };
  } catch (err) {
    return { success: false, error: 'Erro de sintaxe no JSON importado' };
  }
}
/* ==== END: src/store/store.js ==== */

/**
 * Despacha itens pendentes da fila outbox para o backend Railway.
 * Suporta injeção de fetchFn para testes limpos e offline.
 *
 * @param {object} state - Estado atual contendo state.outbox
 * @param {Function} [fetchFn=typeof fetch !== 'undefined' ? fetch : null]
 * @param {string} [nowIso=new Date().toISOString()]
 * @returns {Promise<{ state: object, sentCount: number, failedCount: number }>}
 */
async function processOutbox(state, fetchFn = (typeof fetch !== 'undefined' ? fetch : null), nowIso = new Date().toISOString()) {
  if (!state?.outbox || !Array.isArray(state.outbox) || state.outbox.length === 0) {
    return { state, sentCount: 0, failedCount: 0 };
  }

  if (!fetchFn) {
    return { state, sentCount: 0, failedCount: 0 };
  }

  let sentCount = 0;
  let failedCount = 0;

  const nextOutbox = [...state.outbox];

  for (let i = 0; i < nextOutbox.length; i++) {
    const item = nextOutbox[i];
    if (item.status === 'sent') continue;
    if (item.status === 'failed' && item.attempts >= 5) continue;

    // Inicia envio
    nextOutbox[i] = transitionOutboxItem(item, 'START_SEND', { nowIso });

    try {
      const response = await fetchFn(LEAD_CAPTURE_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(item.payload || {})
      });

      if (response && response.ok) {
        let responseId = null;
        try {
          const json = await response.json();
          responseId = json?.leadId || json?.id || null;
        } catch {
          // Resposta sem corpo JSON legível
        }
        nextOutbox[i] = transitionOutboxItem(nextOutbox[i], 'SEND_SUCCESS', {
          nowIso,
          responseId
        });
        sentCount++;
      } else {
        const statusText = response ? `HTTP ${response.status}` : 'Falha na resposta';
        nextOutbox[i] = transitionOutboxItem(nextOutbox[i], 'SEND_FAIL', {
          nowIso,
          error: statusText
        });
        failedCount++;
      }
    } catch (err) {
      nextOutbox[i] = transitionOutboxItem(nextOutbox[i], 'SEND_FAIL', {
        nowIso,
        error: err?.message || 'Erro de rede'
      });
      failedCount++;
    }
  }

  const nextState = {
    ...state,
    outbox: nextOutbox
  };

  return {
    state: nextState,
    sentCount,
    failedCount
  };
}
/* ==== END: src/store/outbox.js ==== */

// src/fx/fx.js - Executor Central de Efeitos Impuros


/**
 * Executa uma lista de efeitos retornados pelo redutor puro update().
 * @param {Array<{ type: string, payload?: any }>} fxList
 * @param {object} [ctx] - Contexto de injeção opcional
 */
function executeEffects(fxList = [], ctx = {}) {
  if (!Array.isArray(fxList) || fxList.length === 0) return;

  for (const eff of fxList) {
    if (!eff || !eff.type) continue;

    switch (eff.type) {
      case 'SAY_TEXT':
        say(eff.payload?.text, eff.payload?.rate);
        break;

      case 'PLAY_SFX':
        if (eff.payload?.sfx === 'success') {
          playSuccessChime();
        } else if (eff.payload?.sfx === 'tick') {
          playTick();
        }
        break;

      case 'TRIGGER_CELEBRATION':
        playSuccessChime();
        if (typeof ctx.onCelebration === 'function') {
          ctx.onCelebration(eff.payload);
        }
        break;

      case 'ANNOUNCE_SR':
        if (typeof document !== 'undefined') {
          const sr = document.getElementById('sr-announcer');
          if (sr && eff.payload?.message) {
            sr.textContent = eff.payload.message;
          }
        }
        break;

      case 'NAVIGATE':
        if (typeof window !== 'undefined' && eff.payload?.route) {
          window.location.hash = eff.payload.route;
        }
        break;

      default:
        break;
    }
  }
}

/**
 * Pronuncia uma frase em inglês norte-americano (en-US).
 * Se o navegador não suportar síntese de áudio, falha graciosamente sem travar a interface.
 *
 * @param {string} text - Texto a ser falado em inglês
 * @param {number} [rate=0.95] - Velocidade da fala
 * @returns {boolean} Se a síntese foi iniciada com sucesso
 */
function say(text, rate = 0.95) {
  if (typeof window === 'undefined' || !window.speechSynthesis) {
    return false;
  }

  try {
    window.speechSynthesis.cancel(); // Cancela falas anteriores em fila

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = rate;

    // Tenta selecionar voz nativa do Google ou do sistema
    const voices = window.speechSynthesis.getVoices();
    const usVoice = voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha')));
    if (usVoice) {
      utterance.voice = usVoice;
    }

    window.speechSynthesis.speak(utterance);
    return true;
  } catch {
    return false;
  }
}

/**
 * Alias canônico para say()
 */

// src/fx/sfx.js - Efeitos Sonoros Sintetizados via Web Audio API Pura (Zero arquivos externos)

let audioCtx = null;

function getAudioContext() {
  if (typeof window === 'undefined') return null;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!audioCtx) {
    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

/**
 * Toca um acorde de celebração e sucesso.
 */
function playSuccessChime() {
  const ctx = getAudioContext();
  if (!ctx) return false;

  try {
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // Acorde Dó Maior (C5, E5, G5, C6)

    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + (idx * 0.08));

      gain.gain.setValueAtTime(0.001, now + (idx * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.15, now + (idx * 0.08) + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + (idx * 0.08) + 0.4);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now + (idx * 0.08));
      osc.stop(now + (idx * 0.08) + 0.45);
    });
    return true;
  } catch {
    return false;
  }
}

/**
 * Toca um bipe curto de cronômetro / contagem regressiva.
 */
function playTick() {
  const ctx = getAudioContext();
  if (!ctx) return false;

  try {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, now); // Nota Lá (A5)

    gain.gain.setValueAtTime(0.05, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + 0.06);
    return true;
  } catch {
    return false;
  }
}

/**
 * Despacha efeito sonoro pelo tipo ('success' | 'tick').
 * @param {string} type
 * @returns {boolean}
 */
function playSfx(type = 'success') {
  if (type === 'tick') return playTick();
  return playSuccessChime();
}
/* ==== END: src/fx/sfx.js ==== */

// src/fx/timer.js - Controlador de Cronômetro de Alta Precisão

let timerInterval = null;

/**
 * Inicia cronômetro regressivo com callback de atualização e término.
 * @param {number} durationMs - Duração em milissegundos
 * @param {(remainingMs: number) => void} onTick - Callback a cada tick
 * @param {() => void} onComplete - Callback de conclusão
 * @returns {() => void} Função de cancelamento
 */
function startCountdown(durationMs, onTick, onComplete) {
  cancelCountdown();

  if (typeof window === 'undefined') {
    return cancelCountdown;
  }

  const startTime = Date.now(); // Note: inside fx controller (impure boundary)
  const endTime = startTime + durationMs;

  timerInterval = window.setInterval(() => {
    const now = Date.now();
    const remaining = Math.max(0, endTime - now);

    if (typeof onTick === 'function') {
      onTick(remaining);
    }

    if (remaining <= 0) {
      cancelCountdown();
      if (typeof onComplete === 'function') {
        onComplete();
      }
    }
  }, 50);

  return cancelCountdown;
}

/**
 * Cancela o cronômetro ativo.
 */
function cancelCountdown() {
  if (timerInterval !== null && typeof window !== 'undefined') {
    window.clearInterval(timerInterval);
    timerInterval = null;
  }
}
/* ==== END: src/fx/timer.js ==== */

// src/art/radar.js - Gráfico de Radar SVG Procedural (Comparação Dia 1 vs Dia 7 e Laudo)

/**
 * Converte coordenadas polares (raio e ângulo em graus) para cartesianas (x, y).
 */
function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
  const angleInRadians = ((angleInDegrees - 90) * Math.PI) / 180.0;
  return {
    x: centerX + radius * Math.cos(angleInRadians),
    y: centerY + radius * Math.sin(angleInRadians)
  };
}

/**
 * Gera string SVG pura de gráfico de radar triangular (3 eixos: Fluência, Automaticidade, Resiliência).
 *
 * @param {object} props
 * @param {{ fluencia: number, automaticidade: number, resiliencia: number }} [props.scoresD1] - Notas 1 a 5 do Dia 1
 * @param {{ fluencia: number, automaticidade: number, resiliencia: number }} [props.scoresD7] - Notas 1 a 5 do Dia 7
 * @param {number} [props.size=300] - Largura e altura em pixels
 * @returns {string} Markup SVG completo
 */
function renderRadarSvg({ scoresD1 = null, scoresD7 = null, size = 300 }) {
  const center = size / 2;
  const maxRadius = (size / 2) * 0.72;

  // Ângulos dos 3 eixos (120° entre si): 0° (topo), 120° (inferior direito), 240° (inferior esquerdo)
  const angles = [0, 120, 240];
  const labels = ['Fluência', 'Automaticidade', 'Resiliência'];

  // 1. Círculos de grade (níveis 1 a 5)
  const gridRings = [];
  for (let lvl = 1; lvl <= 5; lvl++) {
    const r = (maxRadius / 5) * lvl;
    gridRings.push(`<circle cx="${center}" cy="${center}" r="${r.toFixed(1)}" fill="none" stroke="var(--line2, #30303b)" stroke-width="1" stroke-dasharray="${lvl < 5 ? '2,2' : 'none'}" />`);
  }

  // 2. Linhas dos 3 eixos e rótulos
  const axisLines = [];
  const axisLabels = [];
  angles.forEach((deg, idx) => {
    const end = polarToCartesian(center, center, maxRadius, deg);
    axisLines.push(`<line x1="${center}" y1="${center}" x2="${end.x.toFixed(1)}" y2="${end.y.toFixed(1)}" stroke="var(--line3, #3d3d4b)" stroke-width="1.5" />`);

    const labelPos = polarToCartesian(center, center, maxRadius + 22, deg);
    const anchor = deg === 0 ? 'middle' : (deg === 120 ? 'start' : 'end');
    axisLabels.push(`<text x="${labelPos.x.toFixed(1)}" y="${labelPos.y.toFixed(1)}" font-family="var(--font-mono, monospace)" font-size="11" font-weight="600" fill="var(--text2, #b8b8c6)" text-anchor="${anchor}">${labels[idx]}</text>`);
  });

  // Função para calcular pontos de um polígono a partir das notas
  function getPolygonPoints(scores) {
    if (!scores) return null;
    const vals = [
      Math.max(1, Math.min(5, scores.fluencia || 1)),
      Math.max(1, Math.min(5, scores.automaticidade || 1)),
      Math.max(1, Math.min(5, scores.resiliencia || 1))
    ];
    return angles.map((deg, idx) => {
      const r = (maxRadius / 5) * vals[idx];
      const pt = polarToCartesian(center, center, r, deg);
      return `${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
    }).join(' ');
  }

  // Polígono Dia 1 (Alerta / Laranja sutil)
  let d1Markup = '';
  const ptsD1 = getPolygonPoints(scoresD1);
  if (ptsD1) {
    d1Markup = `<polygon points="${ptsD1}" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="2" stroke-dasharray="4,2" />`;
  }

  // Polígono Dia 7 (Verde SPARK vibrante)
  let d7Markup = '';
  const ptsD7 = getPolygonPoints(scoresD7);
  if (ptsD7) {
    d7Markup = `<polygon points="${ptsD7}" fill="rgba(62, 207, 142, 0.35)" stroke="#3ecf8e" stroke-width="2.5" />`;
  }

  return `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="radar-chart" role="img" aria-label="Gráfico de radar dos três pilares neurais: Fluência, Automaticidade e Resiliência">
      ${gridRings.join('\n')}
      ${axisLines.join('\n')}
      ${d1Markup}
      ${d7Markup}
      ${axisLabels.join('\n')}
    </svg>
  `.trim();
}
/* ==== END: src/art/radar.js ==== */

// src/ui/esc.js - Sanitização estrita contra Cross-Site Scripting (XSS)

/**
 * Escapa caracteres HTML perigosos em strings interpoladas.
 * Trata estritamente: & < > " ' e crase `
 *
 * @param {any} val - Valor a escapar
 * @returns {string} String higienizada
 */
function esc(val) {
  if (val === null || val === undefined) {
    return '';
  }
  const str = String(val);
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/`/g, '&#96;');
}
/* ==== END: src/ui/esc.js ==== */

// src/ui/h.js - Helper funcional para geração de markup HTML

/**
 * Constrói string HTML a partir de tag, atributos e filhos.
 * @param {string} tag - Nome da tag (ex: 'div', 'button')
 * @param {Record<string, any>} attrs - Atributos HTML
 * @param {string|string[]} [children] - Conteúdo interno já seguro
 * @returns {string} String HTML formatada
 */
function h(tag, attrs = {}, children = '') {
  const attrList = [];
  for (const [key, val] of Object.entries(attrs)) {
    if (val === false || val === null || val === undefined) continue;
    if (val === true) {
      attrList.push(key);
    } else {
      attrList.push(`${key}="${esc(val)}"`);
    }
  }

  const attrStr = attrList.length > 0 ? ` ${attrList.join(' ')}` : '';
  const inner = Array.isArray(children) ? children.join('') : String(children);

  const voidTags = ['img', 'input', 'br', 'hr', 'meta', 'link'];
  if (voidTags.includes(tag.toLowerCase()) && !inner) {
    return `<${tag}${attrStr}>`;
  }

  return `<${tag}${attrStr}>${inner}</${tag}>`;
}
/* ==== END: src/ui/h.js ==== */

// src/ui/morph.js - Reconciliação DOM limpa com preservação de foco (Único módulo com innerHTML permitido por L09)

/**
 * Reconcilia o conteúdo HTML do elemento alvo preservando o foco e a rolagem.
 * @param {HTMLElement|string} target - Elemento DOM ou seletor
 * @param {string} newHtml - Nova string HTML a injetar
 */
function morph(target, newHtml) {
  if (typeof document === 'undefined') {
    // Ambiente Node.js (testes unitários)
    return;
  }

  const el = typeof target === 'string' ? document.querySelector(target) : target;
  if (!el) return;

  // Salva elemento focado atual se houver
  const active = document.activeElement;
  let focusSelector = null;
  let cursorStart = null;
  let cursorEnd = null;

  if (active && el.contains(active)) {
    if (active.id) {
      focusSelector = `#${active.id}`;
    } else if (active.getAttribute('data-act')) {
      focusSelector = `[data-act="${active.getAttribute('data-act')}"]`;
    } else if (active.getAttribute('name')) {
      focusSelector = `[name="${active.getAttribute('name')}"]`;
    }

    if (typeof active.selectionStart === 'number') {
      cursorStart = active.selectionStart;
      cursorEnd = active.selectionEnd;
    }
  }

  // Atualização atômica do nó
  el.innerHTML = newHtml;

  // Restaura foco e cursor se o elemento ainda existir
  if (focusSelector) {
    const toFocus = el.querySelector(focusSelector);
    if (toFocus) {
      toFocus.focus();
      if (cursorStart !== null && typeof toFocus.setSelectionRange === 'function') {
        toFocus.setSelectionRange(cursorStart, cursorEnd);
      }
    }
  }
}
/* ==== END: src/ui/morph.js ==== */

/**

function renderStreakPill({ count = 0, status = 'active', shieldAvailable = true }) {

/**
 * Renderiza item de checklist clicável com suporte a teclado.
 * @param {object} props
 * @returns {string} HTML
 */
function renderChecklistItem({ checked = false, label = '', act = 'toggle_mission_item', index = 0 }) {
  const checkAttr = checked ? 'checked aria-checked="true"' : 'aria-checked="false"';
  const checkIcon = checked ? '✓' : '';
  const itemClass = checked ? 'checklist-item checked' : 'checklist-item';

  return `
    <div class="${itemClass}" data-act="${esc(act)}" data-index="${esc(index)}" role="checkbox" ${checkAttr} tabindex="0">
      <span class="check-box" aria-hidden="true">${checkIcon}</span>
      <span class="check-label">${esc(label)}</span>
    </div>
  `;
}

/**
 * Renderiza grupo de escala de autoavaliação (1 a 5).
 * @param {object} props
 * @returns {string} HTML
 */
function renderScaleGroup({ key, label, value = null, min = 1, max = 5 }) {
  const buttons = [];
  for (let i = min; i <= max; i++) {
    const isSelected = value === i;
    const activeClass = isSelected ? 'scale-btn on' : 'scale-btn';
    const ariaPress = isSelected ? 'aria-pressed="true"' : 'aria-pressed="false"';
    buttons.push(`<button type="button" class="${activeClass}" data-act="set_day_note" data-key="${esc(key)}" data-val="${i}" ${ariaPress}>${i}</button>`);
  }

  return `
    <div class="scale-group" role="group" aria-label="${esc(label)}">
      <div class="scale-header">
        <span class="scale-label">${esc(label)}</span>
        <span class="scale-current mono">${value !== null ? `${value}/${max}` : 'Não avaliado'}</span>
      </div>
      <div class="scale-buttons">${buttons.join('')}</div>
    </div>
  `;
}

/**
 * Renderiza barra de cronômetro com transição de cores.
 * @param {object} props
 * @returns {string} HTML
 */
function renderTimerBar({ remainingMs, totalMs = 4000, label = '' }) {
  const safeRem = Math.max(0, remainingMs);
  const percent = Math.min(100, Math.max(0, (safeRem / totalMs) * 100));

  let colorClass = 'timer-green';
  if (percent < 30) {
    colorClass = 'timer-red';
  } else if (percent < 60) {
    colorClass = 'timer-yellow';
  }

  const secs = (safeRem / 1000).toFixed(1);

  return `
    <div class="timer-container" role="timer" aria-live="polite" aria-label="${esc(label)}: ${secs} segundos">
      <div class="timer-header">
        <span class="label">${esc(label)}</span>
        <strong class="timer-digits mono">${secs}s</strong>
      </div>
      <div class="timer-track">
        <div class="timer-bar ${colorClass}" style="width: ${percent}%;"></div>
      </div>
    </div>
  `;
}

            <ul class="clean-list">
              <li><strong>Raid Kit de Chunks:</strong> Fixa blocos pré-fabricados para eliminar o delay do tradutor mental.</li>
              <li><strong>Prática Espaçada (1, 3 e 7 dias):</strong> Garante que os chunks subam para a automaticidade permanente.</li>
              <li><strong>Adaptive Recasting:</strong> Corrige suas frases no fluxo natural, sem travar seu raciocínio.</li>
            </ul>
          </div>
        </section>

        <section class="card diag-actions-card">
          <a href="${ROUTES.SETUP}" class="btn btn-primary btn-lg" data-act="NAVIGATE" data-param="${ROUTES.SETUP}">

          <button type="button" class="btn btn-ghost" data-act="START_DIAGNOSTIC">
            Refazer Diagnóstico
          </button>
        </section>
      </div>
    `;
  }

  // 2. Estado: Em Andamento (Rodadas 1 a 3)
  if (isStarted) {
    const pool = state?.test?.form === 'B' ? DIAG_POOL_B : DIAG_POOL_A;
    const answers = state?.test?.answers || [];
    const currentIdx = Math.min(answers.length, pool.length - 1);
    const q = pool[currentIdx];
    const roundNumber = currentIdx + 1;

    const timerHtml = renderTimerBar(4000, 4000);

    return `
      <div class="view view-diagnostico view-diag-active">
        <header class="diag-header">
          <span class="text-mono text-muted">RODADA ${roundNumber} DE ${pool.length}</span>

        <section class="card diag-active-card">

              <button type="button" class="btn btn-choice" data-act="SUBMIT_ANSWER" data-param='{"type":"${esc(opt.type)}","ms":4000}'>
                ${esc(opt.text)}
              </button>
            `).join('')}
          </div>
        </section>
      </div>
    `;
  }

  // 3. Estado: Inicial (Instruções e Preparação)
  const heroHtml = renderHeroBanner({
    tag: 'TESTE DE VELOCIDADE · 3 MIN',
    title: 'Diagnóstico Cirúrgico de Fala',
    subtitle: 'Descubra se você fala por blocos prontos ou se fica refém da tradução mental.'
  });

  return `
    <div class="view view-diagnostico view-diag-intro">
      ${heroHtml}

      <section class="card diag-intro-card">
        <h3>Como funciona o teste</h3>
        <ul class="clean-list">
          <li class="bullet-item">
            <span class="bullet-num">1</span>

              <strong>3 situações reais em áudio</strong>
              <p>Você ouvirá frases autênticas do cotidiano em inglês gravadas ou sintetizadas nativamente.</p>
            </div>

            <span class="bullet-num">3</span>

              <strong>Sem julgamento ou nota punitiva</strong>

// src/views/chunks.js - Vista do Raid Kit de 10 Chunks com Caixas Leitner





/**
 * Renderiza a visualização do Raid Kit de Chunks.
 * @param {object} state
 * @returns {string}
 */
function renderChunksView(state) {
  const chunksState = state?.chunks || {};
  const totalXp = computeChunkXp(chunksState);

  // Contagem por estágio Leitner
  let stage0 = 0;
  let stage1 = 0;
  let stage2 = 0;
  let stage3 = 0;

  for (const ch of CHUNKS) {
    const s = chunksState[ch.id]?.stage || 0;
    if (s === 3) stage3++;
    else if (s === 2) stage2++;
    else if (s === 1) stage1++;
    else stage0++;
  }

  const heroHtml = renderHeroBanner({
    tag: 'MATERIAL DE USO CONTÍNUO · RAID KIT',
    title: 'Raid Kit: 10 Chunks Essenciais',
    subtitle: 'Os blocos pré-fabricados para você pedir, trocar, checar e reagir a imprevistos sem recorrer ao tradutor mental.'
  });

  return `
    <div class="view view-chunks">
      ${heroHtml}

      <section class="card leitner-summary-card">
        <div class="leitner-header">
          <h3>Evolução no Deck Leitner</h3>
          <span class="badge badge-primary">${totalXp} / 200 XP Máx</span>
        </div>
        <p class="text-muted text-sm">
          A cada revisão espaçada bem-sucedida, o chunk sobe de caixa (+4 XP no Estágio 1, +10 XP no Estágio 2, +20 XP no Estágio 3).
        </p>

        <div class="grid-leitner-boxes">
          <div class="leitner-box box-0">
            <span class="box-count">${stage0}</span>
            <span class="box-label">A Iniciar</span>
            <span class="box-interval">Estágio 0</span>
          </div>

          <div class="leitner-box box-1">
            <span class="box-count">${stage1}</span>
            <span class="box-label">Caixa 1</span>
            <span class="box-interval">Revisão: 1 dia (+4 XP)</span>
          </div>

          <div class="leitner-box box-2">
            <span class="box-count">${stage2}</span>
            <span class="box-label">Caixa 2</span>
            <span class="box-interval">Revisão: 3 dias (+10 XP)</span>
          </div>

          <div class="leitner-box box-3">
            <span class="box-count">${stage3}</span>
            <span class="box-label">Caixa 3 (Dominado)</span>
            <span class="box-interval">Revisão: 7 dias (+20 XP)</span>
          </div>
        </div>
      </section>

      <section class="chunks-deck-section" aria-label="Deck dos 10 Chunks">
        <div class="deck-cards-list">
          ${CHUNKS.map((chunk) => {
            const cardState = chunksState[chunk.id] || {};
            return renderChunkCard({
              chunk,
              state: cardState,
              showReviewControls: true
            });
          }).join('')}
        </div>
      </section>

      <section class="card print-sheet-card">
        <div class="print-callout">

// src/router/routes.js - Sistema canônico de rotas e hashing do PlayApp SPARK

/**
 * Títulos canônicos de cada rota para acessibilidade e tag <title>.
 */
const ROUTE_TITLES = Object.freeze({
  [ROUTES.CAPA]: 'PlayApp SPARK · Início',
  [ROUTES.MAPA]: 'PlayApp SPARK · Mapa do Método',
  [ROUTES.METODO]: 'PlayApp SPARK · O Método SPARK',
  [ROUTES.DIAGNOSTICO]: 'PlayApp SPARK · Diagnóstico Cirúrgico',
  [ROUTES.SETUP]: 'PlayApp SPARK · Setup Inicial',
  [ROUTES.TRILHA]: 'PlayApp SPARK · Trilha dos 7 Dias',
  [ROUTES.DIA]: 'PlayApp SPARK · Dia {num}',
  [ROUTES.CHUNKS]: 'PlayApp SPARK · Raid Kit (Chunks)',
  [ROUTES.ARENA]: 'PlayApp SPARK · Arena Boss Raid',
  [ROUTES.PROMPTS]: 'PlayApp SPARK · Prompts de Treino',
  [ROUTES.LAUDO]: 'PlayApp SPARK · Laudo de Fluência',
  [ROUTES.ALPHA]: 'PlayApp SPARK · Turma Alpha',
  [ROUTES.IMPRIMIR]: 'PlayApp SPARK · Laudo para Impressão',
  [ROUTES.CONTA]: 'PlayApp SPARK · Ajustes da Conta'
});

/**
 * Normaliza uma string de hash para o formato canônico #/caminho.
 * @param {string} rawHash
 * @returns {string}
 */
function normalizeHash(rawHash) {
  if (!rawHash || typeof rawHash !== 'string') return '#/';
  let clean = rawHash.trim();
  if (!clean || clean === '#') return '#/';
  if (!clean.startsWith('#')) clean = '#' + clean;
  // Transforma #dia/1 em #/dia/1
  if (clean.length > 1 && clean[1] !== '/') {
    clean = '#/' + clean.slice(1);
  }
  return clean;
}

/**
 * Analisa e extrai parâmetros e query string de um hash de URL.
 * @param {string} rawHash
 * @returns {{
 *   pattern: string,
 *   routeKey: string,
 *   path: string,
 *   params: Record<string, any>,
 *   query: Record<string, string>,
 *   isExplore: boolean,
 *   title: string
 * }}
 */
function parseRoute(rawHash) {
  const normalized = normalizeHash(rawHash);
  const [pathPart, queryPart] = normalized.split('?');

  const query = {};
  if (queryPart) {
    const pairs = queryPart.split('&');
    for (const pair of pairs) {
      if (!pair) continue;
      const [k, v] = pair.split('=');
      query[decodeURIComponent(k)] = v ? decodeURIComponent(v) : '';
    }
  }

  const isExplore = query.explore === '1';

  // Casamento de rota dinâmica: #/dia/:num
  const diaMatch = /^#\/dia\/([1-7])$/.exec(pathPart);
  if (diaMatch) {
    const num = parseInt(diaMatch[1], 10);
    const title = ROUTE_TITLES[ROUTES.DIA].replace('{num}', String(num));
    return {
      pattern: ROUTES.DIA,
      routeKey: 'DIA',
      path: pathPart,
      params: { num },
      query,
      isExplore,
      title
    };
  }

  // Casamento de rotas estáticas
  for (const [key, pattern] of Object.entries(ROUTES)) {
    if (pattern === pathPart) {
      return {
        pattern,
        routeKey: key,
        path: pathPart,
        params: {},
        query,
        isExplore,
        title: ROUTE_TITLES[pattern] || 'PlayApp SPARK'
      };
    }
  }

  // Rota não reconhecida -> Fallback para CAPA (#/)
  return {
    pattern: ROUTES.CAPA,
    routeKey: 'CAPA',
    path: '#/',
    params: {},
    query,
    isExplore,
    title: ROUTE_TITLES[ROUTES.CAPA]
  };
}

/**
 * Constrói uma URL hash a partir do padrão ou chave e parâmetros.
 * @param {string} patternOrKey
 * @param {Record<string, any>} [params={}]
 * @param {Record<string, string>} [query={}]
 * @returns {string}
 */
function buildRoute(patternOrKey, params = {}, query = {}) {
  let pattern = ROUTES[patternOrKey] || patternOrKey;
  if (pattern === ROUTES.DIA && params.num) {
    pattern = `#/dia/${params.num}`;
  }

  const queryKeys = Object.keys(query);
  if (queryKeys.length > 0) {
    const qStr = queryKeys
      .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(query[k])}`)
      .join('&');
    return `${pattern}?${qStr}`;
  }

  return pattern;
}
