// src/core/time.js - Funções puras de tempo, fuso horário e virada de ciclo diário (corte às 04:00)

/**
 * Converte data ISO ou milissegundos para objeto Date determinístico.
 * @param {string|number|Date} input
 * @returns {Date}
 */
function toDate(input) {
  if (input instanceof Date) return new Date(input.getTime());
  if (typeof input === 'number') return new Date(input);
  if (typeof input === 'string') return new Date(input);
  return new Date(0);
}

/**
 * Retorna a data no fuso de Brasília (UTC-3) como string YYYY-MM-DD considerando o horário de corte.
 * Por padrão, o corte do dia ocorre às 04:00 da manhã.
 * Qualquer atividade antes das 04:00 pertence ao dia letivo anterior.
 *
 * @param {string|number|Date} input - Data/hora da ação
 * @param {number} cutHour - Hora de virada do dia (default: 4)
 * @param {number} tzOffsetHours - Deslocamento de fuso em horas (default: -3 para Brasília)
 * @returns {string} Data letiva formato "YYYY-MM-DD"
 */
function studyDay(input, cutHour = 4, tzOffsetHours = -3) {
  const d = toDate(input);
  // Ajusta para o fuso horário alvo adicionando o offset em milissegundos
  const utcMs = d.getTime() + (d.getTimezoneOffset() * 60000);
  const targetMs = utcMs + (tzOffsetHours * 3600000);
  const localDate = new Date(targetMs);

  // Subtrai cutHour horas para deslocar a virada do dia
  localDate.setHours(localDate.getHours() - cutHour);

  const year = localDate.getFullYear();
  const month = String(localDate.getMonth() + 1).padStart(2, '0');
  const day = String(localDate.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}

/**
 * Calcula a diferença em dias inteiros entre duas datas no formato YYYY-MM-DD.
 * @param {string} dateStrA - "YYYY-MM-DD"
 * @param {string} dateStrB - "YYYY-MM-DD"
 * @returns {number} Diferença (B - A) em dias
 */
function diffDays(dateStrA, dateStrB) {
  if (!dateStrA || !dateStrB) return 0;
  const [y1, m1, d1] = dateStrA.split('-').map(Number);
  const [y2, m2, d2] = dateStrB.split('-').map(Number);

  const utc1 = Date.UTC(y1, m1 - 1, d1);
  const utc2 = Date.UTC(y2, m2 - 1, d2);

  const msPerDay = 86400000;
  return Math.floor((utc2 - utc1) / msPerDay);
}

/**
 * Formata minutos para exibição MM:SS
 * @param {number} totalSeconds
 * @returns {string} "MM:SS"
 */
function formatTimer(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const mins = Math.floor(s / 60);
  const secs = s % 60;
  return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

/**
 * Atualiza o estado da ofensiva quando uma atividade obrigatória é concluída no dia.
 * @param {object} streakState - { count, best, lastCompletedDate, shieldAvailable, history }
 * @param {string} currentDayStr - Data do dia letivo atual "YYYY-MM-DD"
 * @returns {object} Novo estado de ofensiva atualizado
 */
function recordStreak(streakState, currentDayStr) {
  const current = {
    count: streakState?.count || 0,
    best: streakState?.best || 0,
    lastCompletedDate: streakState?.lastCompletedDate || null,
    shieldAvailable: streakState?.shieldAvailable !== undefined ? Boolean(streakState.shieldAvailable) : true,
    history: Array.isArray(streakState?.history) ? [...streakState.history] : []
  };

  if (!current.lastCompletedDate) {
    // Primeiro dia concluído
    current.count = 1;
    current.best = 1;
    current.lastCompletedDate = currentDayStr;
    current.history.push(currentDayStr);
    return current;
  }

  const diff = diffDays(current.lastCompletedDate, currentDayStr);

  if (diff <= 0) {
    // Já concluiu no mesmo dia letivo
    return current;
  }

  if (diff === 1) {
    // Dia consecutivo: incrementa ofensiva
    current.count += 1;
    current.best = Math.max(current.best, current.count);
    current.lastCompletedDate = currentDayStr;
    current.history.push(currentDayStr);
    return current;
  }

  if (diff === 2 && current.shieldAvailable) {
    // Falhou um dia, mas possui escudo protetor ativo!
    current.shieldAvailable = false;
    current.count += 1;
    current.best = Math.max(current.best, current.count);
    current.lastCompletedDate = currentDayStr;
    current.history.push(currentDayStr);
    return current;
  }

  // Falha de 2+ dias sem escudo: ofensiva reinicia em 1
  current.count = 1;
  current.lastCompletedDate = currentDayStr;
  current.history.push(currentDayStr);
  return current;
}

/**
 * Avalia o status atual da ofensiva frente ao dia de estudo presente.
 * @param {object} streakState
 * @param {string} currentDayStr - "YYYY-MM-DD"
 * @returns {'active'|'atRisk'|'shielded'|'broken'|'none'}
 */
function streakStatus(streakState, currentDayStr) {
  if (!streakState?.lastCompletedDate) {
    return 'none';
  }

  const diff = diffDays(streakState.lastCompletedDate, currentDayStr);

  if (diff === 0) {
    return 'active'; // Concluído hoje
  }

  if (diff === 1) {
    return 'atRisk'; // Concluiu ontem, precisa praticar hoje para não perder
  }

  if (diff === 2 && streakState.shieldAvailable) {
    return 'shielded'; // Falhou ontem, mas o escudo está pronto para salvar
  }

  return 'broken'; // Quebrou
}

/**

function clamp(val, min, max) {

/**
 * Gerador pseudoaleatório Mulberry32 puro a partir de uma semente inteira.
 * Retorna uma função que produz números entre 0 e 1 de forma pura e determinística.
 */
function createPrng(seed = 12345) {
  let s = (seed >>> 0) || 1;
  return function next() {
    s |= 0;
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Embaralha um array de opções de forma estável usando uma semente.
 * @param {Array} arr - Array de entrada
 * @param {number} seed - Semente inteira
 * @returns {Array} Novo array embaralhado
 */
function shuffleOptions(arr, seed = 12345) {
  const prng = createPrng(seed);
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(prng() * (i + 1));
    const temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

/**
 * Calcula a pontuação de uma rodada individual (0 a 1).
 * @param {{ type?: 'chunk'|'literal'|'word', ms?: number, timeout?: boolean }} ans
 * @param {boolean} extendedTime - Se verdadeiro, dobra as janelas de tempo
 * @returns {number} Score da rodada (0.0 a 1.0)
 */
function scoreRound(ans, extendedTime = false) {
  if (!ans || ans.timeout) {
    // Timeout conta como word com velocidade 0
    return 0.7 * QUALITY_SCORES.word + 0.3 * 0;
  }

  const mult = extendedTime ? 2 : 1;
  const fast = TIMING.FAST * mult;
  const slow = TIMING.SLOW * mult;
  const windowLimit = TIMING.WINDOW * mult;

  const ms = typeof ans.ms === 'number' ? ans.ms : windowLimit;

  // Se excedeu a janela máxima, trata como timeout/word lenta
  if (ms > windowLimit) {
    return 0.7 * QUALITY_SCORES.word + 0.3 * 0;
  }

  const qType = ans.type && QUALITY_SCORES[ans.type] !== undefined ? ans.type : 'word';
  const qScore = QUALITY_SCORES[qType];

  const speed = clamp((slow - ms) / (slow - fast), 0, 1);

  return 0.7 * qScore + 0.3 * speed;
}

/**
 * Calcula o resultado completo do diagnóstico cirúrgico (3 perguntas).
 * E-01: Utiliza tolerância 1e-9 contra imprecisão de ponto flutuante, cravando 59 em 3 literais a 4s.
 * @param {Array<{ type?: string, ms?: number, timeout?: boolean }>} answers
 * @param {boolean} extendedTime
 * @returns {{ score: number, band: 'autônomo'|'descongelando'|'bloqueado', bottleneck: string }}
 */
function scoreDiag(answers = [], extendedTime = false) {
  let rawTotal = 0;

  for (let i = 0; i < 3; i++) {
    const ans = answers[i] || { timeout: true };
    const weight = QUESTION_WEIGHTS[i] || 0.30;
    const rScore = scoreRound(ans, extendedTime);
    rawTotal += rScore * weight;
  }

  // E-01: Adiciona 1e-9 para neutralizar 58.49999999999999 e garantir Math.round -> 59
  const score = Math.round(rawTotal * 100 + 1e-9);
  const band = bandOf(score);

  return {
    score,
    band,
    bottleneck: bottleneckOf(band)
  };
}

/**
 * Determina a faixa de reflexo oral a partir do score final.
 * @param {number} score
 * @returns {'autônomo'|'descongelando'|'bloqueado'}
 */
function bandOf(score) {
  if (score >= 75) return 'autônomo';
  if (score >= 45) return 'descongelando';
  return 'bloqueado';
}

/**
 * Retorna a descrição do gargalo neural/cognitivo para o laudo.
 * @param {'autônomo'|'descongelando'|'bloqueado'} band
 * @returns {string}
 */
function bottleneckOf(band) {
  if (band === 'autônomo') {
    return 'Autonomia consolidada com necessidade de repertório de nuances e imprevistos';
  }
  if (band === 'descongelando') {
    return 'Tradução mental intermitente e hesitação na troca de estruturas';
  }
  return 'Congelamento oral, dependência de tradução palavra por palavra e medo de errar';
}

/**
 * Migra dados legados (v1, v2 ou desconhecido) para o Estado v3 canônico.
 * Nunca lança erro, preserva progresso do usuário e garante validade do schema.
 * @param {any} raw
 * @returns {object} Estado v3 garantido
 */
function migrate(raw) {
  if (!raw) {
    return clone(INITIAL_STATE);
  }

  let parsed = raw;
  if (typeof raw === 'string') {
    try {
      parsed = JSON.parse(raw);
    } catch {
      return clone(INITIAL_STATE);
    }
  }

  if (typeof parsed !== 'object' || parsed === null) {
    return clone(INITIAL_STATE);
  }

  // Se já for v3 e passar na validação estrita, apenas repara possíveis campos opcionais
  if (parsed.v === STATE_VERSION) {
    const check = validateState(parsed);
    if (check.valid) {
      return parsed;
    }
  }

  return repair(parsed);
}

const STAGE_XP = Object.freeze({
  1: 4,
  2: 10,
  3: 20
});
const XP_TABLE = Object.freeze({
  DIAGNOSTIC_COMPLETED: 30,
  SETUP_COMPLETED: 20,
  MISSION_ITEM_CHECKED: 5,
  DAY_CLOSED: 40,
  PROMPT_COPIED: 5,
  BOSS_RAID_COMPLETED: 60
});

/**
 * Calcula o XP derivado das cartas de Chunks praticadas.
 * Errata E-02: O valor atribuído por carta é estritamente o do estágio mais alto já alcançado (top),
 * e NÃO o somatório cumulativo dos estágios 1, 2 e 3.
 *
 * @param {Record<string, { top?: number }>} chunksState
 * @returns {number} XP total dos chunks (máx: 10 * 20 = 200 XP)
 */
function computeChunkXp(chunksState = {}) {
  let total = 0;
  for (const c of Object.values(chunksState)) {
    const top = c?.top || 0;
    total += STAGE_XP[top] || 0;
  }
  return total;
}

/**
 * Atribui XP ao estado garantindo idempotência estrita via chave única no log.
 * @param {object} xpState - { total: number, rank: string, log: Array<{ key, points, at }> }
 * @param {string} key - Chave única do evento (ex: "day_1_close", "ach_first_spark")
 * @param {number} points - Quantidade de pontos a somar
 * @param {string} [atIso] - Data ISO do evento
 * @returns {{ xpState: object, awarded: boolean }}
 */
function awardXp(xpState, key, points, atIso = null) {
  const currentTotal = xpState?.total || 0;
  const currentLog = Array.isArray(xpState?.log) ? [...xpState.log] : [];

  // Idempotência: Se a chave já existir no log, nunca pontua duas vezes
  if (currentLog.some(entry => entry.key === key)) {
    return {
      xpState: {
        total: currentTotal,
        rank: xpState?.rank || rankOf(currentTotal),
        log: currentLog
      },
      awarded: false
    };
  }

  const safePoints = Math.max(0, Number(points) || 0);
  const newTotal = currentTotal + safePoints;
  const newRank = rankOf(newTotal);

  currentLog.push({
    key,
    points: safePoints,
    at: atIso
  });

  return {
    xpState: {
      total: newTotal,
      rank: newRank,
      log: currentLog
    },
    awarded: true
  };
}

// src/core/rank.js - Classificação de Ranks e Limiares de XP
const RANK_THRESHOLDS = Object.freeze([
  { rank: 'fogo', minXp: 750 },
  { rank: 'chama', minXp: 450 },
  { rank: 'brasa', minXp: 150 },
  { rank: 'faísca', minXp: 0 }
]);

/**
 * Retorna o Rank correspondente ao total de XP acumulado.
 * @param {number} xpTotal
 * @returns {'faísca'|'brasa'|'chama'|'fogo'}
 */
function rankOf(xpTotal = 0) {
  const total = Math.max(0, Number(xpTotal) || 0);
  for (const t of RANK_THRESHOLDS) {
    if (total >= t.minXp) {
      return t.rank;
    }
  }
  return 'faísca';
}

/**
 * Retorna o progresso percentual até o próximo rank (0 a 100).
 * @param {number} xpTotal
 * @returns {{ currentRank: string, nextRank: string|null, currentXp: number, nextMinXp: number|null, percent: number }}
 */
function rankProgress(xpTotal = 0) {
  const current = rankOf(xpTotal);
  if (current === 'fogo') {
    return {
      currentRank: 'fogo',
      nextRank: null,
      currentXp: xpTotal,
      nextMinXp: null,
      percent: 100
    };
  }

  if (current === 'chama') {
    const range = 750 - 450;
    const progress = Math.max(0, xpTotal - 450);
    return {
      currentRank: 'chama',
      nextRank: 'fogo',
      currentXp: xpTotal,
      nextMinXp: 750,
      percent: Math.min(100, Math.floor((progress / range) * 100))
    };
  }

  if (current === 'brasa') {
    const range = 450 - 150;
    const progress = Math.max(0, xpTotal - 150);
    return {
      currentRank: 'brasa',
      nextRank: 'chama',
      currentXp: xpTotal,
      nextMinXp: 450,
      percent: Math.min(100, Math.floor((progress / range) * 100))
    };
  }

  // faísca
  const range = 150;
  return {
    currentRank: 'faísca',
    nextRank: 'brasa',
    currentXp: xpTotal,
    nextMinXp: 150,
    percent: Math.min(100, Math.floor((xpTotal / range) * 100))
  };
}

/**
 * Avalia o estado e retorna conquistas recém-desbloqueadas.
 * Função pura e idempotente: nunca adiciona duplicatas à lista existente.
 *
 * @param {object} state - Estado v3 do aluno
 * @returns {{ newlyUnlocked: Array<object>, allUnlockedIds: string[] }}
 */
function evaluateAchievements(state) {
  const currentUnlocked = new Set(Array.isArray(state?.achievements) ? state.achievements : []);
  const newlyUnlocked = [];

  for (const ach of ACHIEVEMENTS) {
    if (currentUnlocked.has(ach.id)) {
      continue;
    }

    let earned = false;

    if (ach.id === 'first_spark' && state?.test?.completed) {
      earned = true;
    } else if (ach.id === 'day1' && state?.days?.['1']?.status === 'fechado') {
      earned = true;
    } else if (ach.id === 'streak3' && (state?.streak?.count || 0) >= 3) {
      earned = true;
    } else if (ach.id === 'streak7' && (state?.streak?.count || 0) >= 7) {
      earned = true;
    } else if (ach.id === 'blind' && (state?.days?.['5']?.status === 'fechado' || state?.days?.['6']?.status === 'fechado')) {
      earned = true;
    } else if (ach.id === 'boss' && (state?.days?.['7']?.status === 'fechado' || state?.arena?.completed)) {
      earned = true;
    }

    if (earned) {
      newlyUnlocked.push(ach);
      currentUnlocked.add(ach.id);
    }
  }

  return {
    newlyUnlocked,
    allUnlockedIds: Array.from(currentUnlocked)
  };
}

// src/core/deck.js - Raid Kit: Sistema Leitner de Repetição Espaçada e Gestão de Chunks
const LEITNER_INTERVALS = Object.freeze({
  1: 1, // Caixa 1: 1 dia
  2: 3, // Caixa 2: 3 dias
  3: 7  // Caixa 3: 7 dias
});

/**
 * Adiciona dias a uma data no formato "YYYY-MM-DD" e retorna a nova data string.
 * @param {string} dateStr - "YYYY-MM-DD"
 * @param {number} days - Quantidade de dias a somar
 * @returns {string} "YYYY-MM-DD"
 */
function addDays(dateStr, days) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(Date.UTC(y, m - 1, d + days));
  const rY = date.getUTCFullYear();
  const rM = String(date.getUTCMonth() + 1).padStart(2, '0');
  const rD = String(date.getUTCDate()).padStart(2, '0');
  return `${rY}-${rM}-${rD}`;
}

/**
 * Registra a revisão ou prática de um Chunk segundo o algoritmo Leitner.
 * Invariante (E-02): O campo `top` (estágio máximo alcançado) NUNCA regride.
 *
 * @param {object} chunkState - { stage, top, nextReviewDate, history }
 * @param {'natural'|'esforco'|'travou'} rating
 * @param {string} currentDayStr - "YYYY-MM-DD"
 * @returns {object} Novo estado atualizado do chunk
 */
function reviewChunk(chunkState, rating, currentDayStr) {
  const prevStage = chunkState?.stage || 0;
  const prevTop = chunkState?.top || 0;
  const history = Array.isArray(chunkState?.history) ? [...chunkState.history] : [];

  let newStage = 1;
  let interval = 1;

  if (rating === 'natural') {
    newStage = Math.min(3, prevStage + 1);
    interval = LEITNER_INTERVALS[newStage] || 7;
  } else if (rating === 'esforco') {
    newStage = Math.max(1, prevStage === 0 ? 1 : prevStage);
    interval = 2;
  } else {
    // 'travou'
    newStage = 1;
    interval = LEITNER_INTERVALS[1];
  }

  // O estágio mais alto (top) nunca regride
  const newTop = Math.max(prevTop, newStage);
  const nextReviewDate = addDays(currentDayStr, interval);

  history.push({
    at: currentDayStr,
    rating,
    stage: newStage
  });

  return {
    stage: newStage,
    top: newTop,
    lastReviewedAt: currentDayStr,
    nextReviewDate,
    history
  };
}

/**
 * Retorna os chunks que estão prontos para revisão na data atual.
 * @param {Record<string, object>} chunksMap - Mapa de id -> chunkState
 * @param {string} currentDayStr - "YYYY-MM-DD"
 * @returns {string[]} Lista de IDs de chunks vencidos para revisão
 */
function dueChunks(chunksMap = {}, currentDayStr) {
  const due = [];
  for (const [id, c] of Object.entries(chunksMap)) {
    if (!c.nextReviewDate) {
      due.push(id);
    } else {
      const diff = diffDays(c.nextReviewDate, currentDayStr);
      // Se diff >= 0, a data de revisão já chegou ou passou
      if (diff >= 0) {
        due.push(id);
      }
    }
  }
  return due;
}

/**
 * Normaliza um número de telefone brasileiro para o formato internacional com código 55.
 * Aceita números com ou sem +55, com 10 ou 11 dígitos (DDD + 8 ou 9 dígitos).
 *
 * @param {string} phoneRaw
 * @returns {string|null} Número no formato "55DD9XXXXXXXX" ou null se inválido
 */
function normalizeBR(phoneRaw) {
  if (!phoneRaw || typeof phoneRaw !== 'string') return null;

  let digits = phoneRaw.replace(/\D/g, '');

  // Se já tiver 55 no início e totalizar 12 ou 13 dígitos
  if (digits.startsWith('55') && (digits.length === 12 || digits.length === 13)) {
    digits = digits.slice(2);
  }

  // Número brasileiro válido possui 10 (fixo) ou 11 dígitos (celular com 9)
  if (digits.length !== 10 && digits.length !== 11) {
    return null;
  }

  const ddd = parseInt(digits.slice(0, 2), 10);
  if (ddd < 11 || ddd > 99) {
    return null;
  }

  return `55${digits}`;
}

/**
 * Transição de estado da fila de envio offline (Outbox).
 * Estados possíveis: 'queued' | 'sending' | 'sent' | 'failed'
 *
 * @param {object} item - Item na fila do outbox
 * @param {'START_SEND'|'SEND_SUCCESS'|'SEND_FAIL'} action
 * @param {object} [eventData]
 * @returns {object} Novo estado do item
 */
function transitionOutboxItem(item, action, eventData = {}) {
  const current = { ...item };

  if (action === 'START_SEND') {
    return {
      ...current,
      status: 'sending',
      lastAttemptAt: eventData.nowIso || null
    };
  }

  if (action === 'SEND_SUCCESS') {
    return {
      ...current,
      status: 'sent',
      sentAt: eventData.nowIso || null,
      responseId: eventData.responseId || null
    };
  }

  if (action === 'SEND_FAIL') {
    const attempts = (current.attempts || 0) + 1;
    return {
      ...current,
      status: 'failed',
      attempts,
      lastError: eventData.error || 'Erro de conexão',
      lastAttemptAt: eventData.nowIso || null
    };
  }

  return current;
}

/**
 * Redutor puro de estado e despachante de efeitos.
 *
 * @param {object} state - Estado atual v3 (imutável)
 * @param {{ type: string, payload?: any }} msg - Ação disparada
 * @param {{ nowMs: number, nowIso: string, studyDay: string }} env - Dependências determinísticas
 * @returns {{ state: object, fx: Array<{ type: string, payload?: any }> }}
 */
function update(state = INITIAL_STATE, msg = {}, env = {}) {
  const current = state || INITIAL_STATE;
  const type = msg?.type;
  const p = msg?.payload || {};

  const nowIso = env.nowIso || '2026-11-04T12:00:00.000Z';
  const today = env.studyDay || '2026-11-04';

  const fx = [];

  switch (type) {
    case 'START_DIAGNOSTIC': {
      const nextState = {
        ...current,
        test: {
          completed: false,
          score: null,
          band: null,
          answers: []
        }
      };
      return { state: nextState, fx };
    }

    case 'SUBMIT_ANSWER': {
      const answers = [...(current.test?.answers || []), p];
      const completed = answers.length >= 3;

      let score = current.test?.score ?? null;
      let band = current.test?.band ?? null;
      let nextXp = { ...(current.xp || { total: 0, rank: 'faísca', log: [] }) };

      if (completed) {
        const diagResult = scoreDiag(answers, Boolean(p.extendedTime));
        score = diagResult.score;
        band = diagResult.band;

        // Atribui XP pelo diagnóstico concluído
        const xpRes = awardXp(nextXp, 'diag_complete', XP_TABLE.DIAGNOSTIC_COMPLETED, nowIso);
        nextXp = xpRes.xpState;

        fx.push({
          type: 'TRIGGER_CELEBRATION',
          payload: { reason: 'diagnostic_completed', score, band }
        });
      }

      const tempState = {
        ...current,
        test: {
          completed,
          score,
          band,
          answers
        },
        xp: nextXp
      };

      // Avalia conquistas (ex: first_spark)
      const achEval = evaluateAchievements(tempState);
      let finalXp = nextXp;
      for (const ach of achEval.newlyUnlocked) {
        finalXp = awardXp(finalXp, `ach_${ach.id}`, ach.points, nowIso).xpState;
      }

      const nextState = {
        ...tempState,
        xp: finalXp,
        achievements: achEval.allUnlockedIds
      };

      return { state: nextState, fx };
    }

    case 'COMPLETE_SETUP_ITEM': {
      const itemKey = p.key; // toolChosen, pinnedChat, scheduleSet, policyChecked
      const setup = {
        ...(current.setup || {}),
        [itemKey]: true
      };
      return {
        state: { ...current, setup },
        fx
      };
    }

    case 'FINISH_SETUP': {
      const setup = {
        ...(current.setup || {}),
        completed: true,
        completedAt: nowIso
      };
      const xpRes = awardXp(current.xp, 'setup_complete', XP_TABLE.SETUP_COMPLETED, nowIso);
      return {
        state: {
          ...current,
          setup,
          xp: xpRes.xpState
        },
        fx
      };
    }

    case 'OPEN_DAY': {
      const dayNum = String(p.num);
      const days = { ...(current.days || {}) };
      days[dayNum] = {
        ...(days[dayNum] || {}),
        status: 'aberto',
        abertoEm: nowIso
      };
      return {
        state: { ...current, days },
        fx
      };
    }

    case 'TOGGLE_MISSION_ITEM': {
      const dayNum = String(p.num);
      const idx = Number(p.index);
      const days = { ...(current.days || {}) };
      const dayData = { ...(days[dayNum] || {}) };
      const missions = Array.isArray(dayData.missions) ? [...dayData.missions] : [];

      missions[idx] = !missions[idx];
      dayData.missions = missions;
      days[dayNum] = dayData;

      return {
        state: { ...current, days },
        fx
      };
    }

    case 'SET_DAY_NOTE': {
      const dayNum = String(p.num);
      const days = { ...(current.days || {}) };
      const dayData = { ...(days[dayNum] || {}) };
      const notes = { ...(dayData.notes || {}), [p.key]: p.value };

      dayData.notes = notes;
      days[dayNum] = dayData;

      return {
        state: { ...current, days },
        fx
      };
    }

    case 'CLOSE_DAY': {
      const dayNum = String(p.num);
      const days = { ...(current.days || {}) };
      const dayData = { ...(days[dayNum] || {}) };

      dayData.status = 'fechado';
      dayData.fechadoEm = nowIso;
      days[dayNum] = dayData;

      // Atualiza ofensiva
      const nextStreak = recordStreak(current.streak, today);

      // Atribui XP do fechamento
      let nextXp = awardXp(current.xp, `day_${dayNum}_close`, XP_TABLE.DAY_CLOSED, nowIso).xpState;

      const tempState = {
        ...current,
        days,
        streak: nextStreak,
        xp: nextXp
      };

      // Avalia conquistas (day1, streak3, streak7, blind, boss)
      const achEval = evaluateAchievements(tempState);
      for (const ach of achEval.newlyUnlocked) {
        nextXp = awardXp(nextXp, `ach_${ach.id}`, ach.points, nowIso).xpState;
      }

      fx.push({
        type: 'TRIGGER_CELEBRATION',
        payload: { reason: 'day_closed', day: dayNum }
      });

      return {
        state: {
          ...tempState,
          xp: nextXp,
          achievements: achEval.allUnlockedIds
        },
        fx
      };
    }

    case 'COPY_PROMPT': {
      const dayNum = String(p.num || 'global');
      const xpRes = awardXp(current.xp, `copy_prompt_d${dayNum}`, XP_TABLE.PROMPT_COPIED, nowIso);
      return {
        state: {
          ...current,
          xp: xpRes.xpState
        },
        fx
      };
    }

    case 'LEVEL_UP_CHUNK':
    case 'REVIEW_CHUNK': {
      const chunkId = p.id;
      const rating = p.rating || 'natural';
      const chunks = { ...(current.chunks || {}) };
      const chunkData = chunks[chunkId] || {};

      const nextChunk = reviewChunk(chunkData, rating, today);
      chunks[chunkId] = nextChunk;

      // Recalcula XP total de chunks
      const chunkXpTotal = computeChunkXp(chunks);
      // Registra/atualiza o XP de chunks via chave dedicada
      let nextXp = awardXp(current.xp, 'chunks_mastery', chunkXpTotal, nowIso).xpState;
      nextXp = {
        ...nextXp,
        rank: rankOf(nextXp.total)
      };

      return {
        state: {
          ...current,
          chunks,
          xp: nextXp
        },
        fx
      };
    }

    case 'RECORD_ARENA_ROUND': {
      const arena = { ...(current.arena || {}) };
      const history = [...(arena.history || []), { ...p, at: nowIso }];
      arena.history = history;

      return {
        state: { ...current, arena },
        fx
      };
    }

    case 'FINISH_ARENA': {
      const arena = {
        ...(current.arena || {}),
        completed: true,
        completedAt: nowIso,
        score: p.score || 100
      };

      let nextXp = awardXp(current.xp, 'arena_boss_victory', XP_TABLE.BOSS_RAID_COMPLETED, nowIso).xpState;

      const tempState = {
        ...current,
        arena,
        xp: nextXp
      };

      const achEval = evaluateAchievements(tempState);
      for (const ach of achEval.newlyUnlocked) {
        nextXp = awardXp(nextXp, `ach_${ach.id}`, ach.points, nowIso).xpState;
      }

      fx.push({
        type: 'TRIGGER_CELEBRATION',
        payload: { reason: 'arena_victory', score: arena.score }
      });

      return {
        state: {
          ...tempState,
          arena,
          xp: nextXp,
          achievements: achEval.allUnlockedIds
        },
        fx
      };
    }

    case 'SUBMIT_LEAD': {
      const form = p.form || {};
      const leadRes = buildLeadPayload(current, form);

      if (!leadRes.valid) {
        return {
          state: current,
          fx: [{ type: 'ANNOUNCE_SR', payload: { message: leadRes.errors.join('. ') } }]
        };
      }

      const outboxItem = {
        id: `lead_${nowIso}`,
        payload: leadRes.payload,
        status: 'queued',
        createdAt: nowIso,
        attempts: 0
      };

      const nextOutbox = [...(current.outbox || []), outboxItem];

      fx.push({
        type: 'DISPATCH_OUTBOX',
        payload: outboxItem
      });

      return {
        state: {
          ...current,
          profile: {
            ...(current.profile || {}),
            name: leadRes.payload.name,
            whatsapp: leadRes.payload.whatsapp,
            email: leadRes.payload.email
          },
          outbox: nextOutbox
        },
        fx
      };
    }

    case 'RESET_STATE': {
      return {
        state: JSON.parse(JSON.stringify(INITIAL_STATE)),
        fx: [{ type: 'TRIGGER_CELEBRATION', payload: { reason: 'reset' } }]
      };
    }

    default:
      return { state: current, fx };
  }
}
/* ==== END: src/core/update.js ==== */

/**
 * Interpola variáveis no texto do prompt (ex: [NIVEL] e [CENARIO]).
 * @param {string} template
 * @param {Record<string, string>} vars
 * @returns {string} Prompt preenchido
 */
function renderPrompt(template, vars = {}) {
  let text = template;
  for (const [key, val] of Object.entries(vars)) {
    text = text.replaceAll(`[${key.toUpperCase()}]`, val || '');
  }
  return text;
}
