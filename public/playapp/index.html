// src/router/guards.js - Guardas de acesso, destravamento e modo exploração

/**
 * 24 horas em milissegundos para a janela de edição pós-conclusão.
 */
const EDIT_WINDOW_MS = 24 * 60 * 60 * 1000;

/**
 * Verifica se um dia específico da trilha pode ser acessado pelo aluno.
 * Regra: Dia 1 sempre aberto. Dias 2..7 requerem que o dia anterior esteja concluído.
 * Modo exploração (?explore=1) destrava todos os dias.
 * @param {object} state
 * @param {number|string} dayNum
 * @param {boolean} [isExplore=false]
 * @returns {boolean}
 */
function canAccessDay(state, dayNum, isExplore = false) {
  const num = Number(dayNum);
  if (num < 1 || num > 7) return false;
  if (isExplore) return true;
  if (num === 1) return true;

  const prevDay = state?.days?.[num - 1];
  return Boolean(prevDay && prevDay.completed);
}

/**
 * Verifica se a Arena Boss Raid pode ser acessada.
 * Regra: Destravada se o Dia 6 foi concluído (Dia 7 pronto para raid) ou modo exploração ativo.
 * @param {object} state
 * @param {boolean} [isExplore=false]
 * @returns {boolean}
 */
function canAccessArena(state, isExplore = false) {
  if (isExplore) return true;
  const day6 = state?.days?.[6];
  return Boolean(day6 && day6.completed);
}

/**
 * Verifica se um dia já concluído ainda está na janela de 24h para edição.
 * Se já passou de 24h da conclusão, o dia permanece apenas em modo leitura.
 * @param {object} state
 * @param {number|string} dayNum
 * @param {number} [now=Date.now()]
 * @returns {boolean}
 */
function isDayEditable(state, dayNum, now = Date.now()) {
  const num = Number(dayNum);
  const dayData = state?.days?.[num];
  if (!dayData || !dayData.completed) return true;
  if (!dayData.completedAt) return true;

  const completedTime = typeof dayData.completedAt === 'string'
    ? new Date(dayData.completedAt).getTime()
    : Number(dayData.completedAt);

  if (Number.isNaN(completedTime)) return true;

  return (now - completedTime) <= EDIT_WINDOW_MS;
}

/**
 * Avalia se o estado atual permite navegação para a rota requisitada.
 * Se negada, retorna rota de redirecionamento e justificativa.
 * @param {{
 *   pattern: string,
 *   params: Record<string, any>,
 *   isExplore: boolean
 * }} parsedRoute
 * @param {object} state
 * @param {number} [now=Date.now()]
 * @returns {{ allowed: boolean, redirect?: string, reason?: string }}
 */
function guardRoute(parsedRoute, state, now = Date.now()) {
  if (!parsedRoute) return { allowed: true };

  // Guarda para rota do Dia
  if (parsedRoute.pattern === ROUTES.DIA) {
    const dayNum = parsedRoute.params?.num;
    if (!canAccessDay(state, dayNum, parsedRoute.isExplore)) {
      return {
        allowed: false,
        redirect: ROUTES.TRILHA,
        reason: `O Dia ${dayNum} está bloqueado até que o Dia ${dayNum - 1} seja concluído.`
      };
    }
  }

  // Guarda para a Arena Boss Raid
  if (parsedRoute.pattern === ROUTES.ARENA) {
    if (!canAccessArena(state, parsedRoute.isExplore)) {
      return {
        allowed: false,
        redirect: ROUTES.TRILHA,
        reason: 'A Arena Boss Raid está bloqueada. Complete os Dias 1 a 6 para destravar o boss.'
      };
    }
  }

  return { allowed: true };
}

    case ROUTES.SETUP:
      return renderSetupView(state);
    case ROUTES.TRILHA:
      return renderTrilhaView(state);
    case ROUTES.DIA:
      return renderDiaView(state, { num: parsedRoute.params?.num });
    case ROUTES.CHUNKS:
      return renderChunksView(state);
    case ROUTES.ARENA:

    case ROUTES.PROMPTS:

/**
 * Renderiza a barra inferior canônica com 5 destinos.
 * @param {string} currentPattern
 * @returns {string}
 */
function renderBottomNav(currentPattern) {
  const items = [
    { pattern: ROUTES.TRILHA, label: 'Trilha', icon: '🗺️' },
    { pattern: ROUTES.CHUNKS, label: 'Chunks', icon: '🃏' },
    { pattern: ROUTES.PROMPTS, label: 'Prompts', icon: '💬' },
    { pattern: ROUTES.LAUDO, label: 'Laudo', icon: '📊' },
    { pattern: ROUTES.CONTA, label: 'Conta', icon: '⚙️' }
  ];

  return items.map((it) => {
    const isActive = it.pattern === currentPattern;
    const activeClass = isActive ? 'on' : '';
    const ariaAttr = isActive ? 'aria-current="page"' : '';
    return `
      <a href="${esc(it.pattern)}" class="${activeClass}" ${ariaAttr} data-act="NAVIGATE" data-param="${esc(it.pattern)}">
        <span class="nav-icon" aria-hidden="true">${it.icon}</span>

}

/**
 * Executa efeitos impuros gerados pelo redutor.
 * @param {Array<{ type: string, payload?: any }>} fxList
 */
function executeEffects(fxList = []) {
  if (!Array.isArray(fxList) || fxList.length === 0) return;

  for (const eff of fxList) {
    switch (eff.type) {
      case 'SAY_TEXT':
        sayText(eff.payload);
        break;
      case 'PLAY_SFX':
        playSfx(eff.payload);
        break;
      case 'TRIGGER_CELEBRATION':
        playSfx('success');
        showToast('Parabéns! Conquista registrada.');
        break;
      case 'NAVIGATE':
        if (typeof window !== 'undefined' && eff.payload) {
          window.location.hash = eff.payload;
        }
        break;
      case 'DISPATCH_OUTBOX':
        if (typeof window !== 'undefined' && window.navigator?.onLine) {
          processOutbox(appState).then((res) => {
            if (res.sentCount > 0) {
              appState = res.state;
              saveState(appState);
            }
          });
        }
        break;
      default:
        break;
    }
  }
}

/**
 * Exibe notificação temporária toast.
 * @param {string} msg
 */
function showToast(msg) {
  if (typeof document === 'undefined') return;
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.removeAttribute('hidden');
  setTimeout(() => {
    t.setAttribute('hidden', '');
  }, 2500);
}

/**
 * Ponto de entrada do ciclo de roteamento e renderização no navegador.
 */
function renderCurrentRoute() {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;

  if (!appState) {
    appState = loadState();
  }

  const parsed = parseRoute(window.location.hash);
  const guard = guardRoute(parsed, appState);

  if (!guard.allowed && guard.redirect) {
    window.location.hash = guard.redirect;
    if (guard.reason) {
      showToast(guard.reason);
    }
    return;
  }

  // Atualiza título do documento
  document.title = parsed.title;

  const appEl = document.getElementById('app');
  const navEl = document.getElementById('nav');
  const headerEl = document.getElementById('header');

  const isPrint = parsed.pattern === ROUTES.IMPRIMIR;

  // Renderiza a view principal no container #app com morphing sem perda de foco
  if (appEl) {
    const viewHtml = resolveViewHtml(parsed, appState);
    morph(appEl, viewHtml);
  }

  // Renderiza ou oculta a barra inferior
  if (navEl) {
    if (isPrint) {
      navEl.setAttribute('hidden', '');
    } else {
      navEl.removeAttribute('hidden');
      morph(navEl, renderBottomNav(parsed.pattern));
    }
  }

  // Renderiza ou oculta o cabeçalho
  if (headerEl) {
    if (isPrint) {
      headerEl.setAttribute('hidden', '');
    } else {
      headerEl.removeAttribute('hidden');
      morph(headerEl, renderSiteHeader(appState));
    }
  }

  // Rola suavemente para o topo na troca de tela
  window.scrollTo(0, 0);
}

/**
 * Despachante global de ações do PlayApp.
 * @param {{ type: string, payload?: any }} action
 */
function dispatch(action) {
  if (!action || !action.type) return;

  const nowMs = Date.now();
  const nowIso = new Date(nowMs).toISOString();
  const studyDayStr = studyDay(nowMs);

  const env = { nowMs, nowIso, studyDay: studyDayStr };
  const res = update(appState, action, env);

  appState = res.state;
  saveState(appState);
  executeEffects(res.fx);

  // Re-renderiza a tela atual
  renderCurrentRoute();
}

/**
 * Inicializador da aplicação no ambiente do navegador.
 */
function boot() {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;

  appState = loadState();

  // Escuta mudanças de hash de URL
  window.addEventListener('hashchange', renderCurrentRoute);

  // Escuta retorno de conexão online para descarregar outbox
  window.addEventListener('online', () => {
    processOutbox(appState).then((res) => {
      if (res.sentCount > 0) {
        appState = res.state;
        saveState(appState);
        renderCurrentRoute();
      }
    });
  });

  // Delegação global de cliques para data-act
  document.body.addEventListener('click', (e) => {
    const target = e.target.closest('[data-act]');
    if (!target) return;

    const act = target.getAttribute('data-act');
    const paramRaw = target.getAttribute('data-param');
    let param = paramRaw;

    if (paramRaw && (paramRaw.startsWith('{') || paramRaw.startsWith('['))) {
      try {
        param = JSON.parse(paramRaw);
      } catch {
        // Mantém como string se não for JSON válido
      }
    }

    // Ações especiais de UI
    if (act === 'NAVIGATE' && typeof param === 'string') {
      window.location.hash = param;
      return;
    }

    if (act === 'PRINT') {
      window.print();
      return;
    }

    if (act === 'COPY_TEXT' || act === 'COPY_PROMPT') {
      const textToCopy = typeof param === 'string' ? param : (param?.text || '');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast('Prompt copiado para a área de transferência!');
        });
      }
      if (act === 'COPY_PROMPT') {
        dispatch({ type: 'COPY_PROMPT', payload: param });
      }
      return;
    }

    if (act === 'EXPORT_STATE') {
      const json = exportStateJson(appState);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'spark-alpha-backup.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup exportado com sucesso!');
      return;
    }

    if (act === 'RESET_STATE') {
      if (window.confirm('Tem certeza de que deseja reiniciar o PlayApp? Todo o progresso e XP serão apagados.')) {
        appState = resetStoredState();
        renderCurrentRoute();
        showToast('PlayApp reiniciado ao estado inicial.');
      }
      return;
    }

    if (act === 'SUBMIT_LEAD') {
      const form = document.querySelector('.lead-form');
      if (form) {
        const nameInput = form.querySelector('[name="name"]');
        const phoneInput = form.querySelector('[name="phone"]');
        const lgpdInput = form.querySelector('[name="lgpdConsent"]');

        const formValues = {
          name: nameInput ? nameInput.value : '',
          whatsapp: phoneInput ? phoneInput.value : '',
          lgpdConsent: lgpdInput ? lgpdInput.checked : false,
          submittedAt: new Date().toISOString()
        };

        const validated = buildLeadPayload(appState, formValues);
        if (!validated.valid) {
          showToast(`Atenção: ${validated.errors[0]}`);
          return;
        }

        dispatch({ type: 'SUBMIT_LEAD', payload: validated.payload });
        showToast('Candidatura enviada! Entraremos em contato via WhatsApp.');
        return;
      }
    }

    // Despacho padrão para o redutor
    dispatch({ type: act, payload: param });
  });

  // Render inicial
  renderCurrentRoute();
}

// Disparo automático quando carregado em navegador
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
}
/* ==== END: src/router/boot.js ==== */


})();
</script>
