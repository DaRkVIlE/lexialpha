<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- LexiQuest Monogram Icon -->
  <g id="lexi-symbol">
    <!-- Outer rounded shield/hexagon frame -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="#121212" stroke="#262626" stroke-width="1.5"/>
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#subtle-glow)" fill-opacity="0.15"/>
    
    <!-- Stylized 'L' + Dynamic Speech Waves -->
    <path d="M14 12V34H26" stroke="#58f27f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Soundwave & Quest upward pulse -->
    <path d="M22 20V26" stroke="#58f27f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 15V31" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M34 18V28" stroke="#58f27f" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Spark / Quest Star -->
    <circle cx="34" cy="14" r="2" fill="#58f27f"/>
  </g>
  
  <!-- Wordmark -->
  <text x="56" y="29" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#ffffff">
    Lexi<tspan fill="#58f27f">Quest</tspan>
  </text>
  
  <!-- Definitions -->
  <defs>
    <radialGradient id="subtle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58f27f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58f27f" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
